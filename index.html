    if (!audioCtx || !state.sound) return;
    const t0 = audioCtx.currentTime;
    const len = Math.floor(audioCtx.sampleRate * 0.22);
    const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.value = 1.4;
    filter.frequency.setValueAtTime(700, t0);
    filter.frequency.exponentialRampToValueAtTime(3200, t0 + 0.2);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start(t0);
  }

  const sfx = {
    tap: () => tone(520, 0, 0.07, "sine", 0.14, 820),
    back: () => tone(760, 0, 0.08, "sine", 0.13, 460),
    locked: () => tone(170, 0, 0.16, "triangle", 0.28, 110),
    flip: () => swish(),
    select: (n) => tone(620 + n * 40, 0, 0.08, "sine", 0.15),
    remove: () => tone(440, 0, 0.08, "sine", 0.13, 300),
  };

  function playCorrect() {
    tone(784, 0, 0.18, "triangle", 0.3);
    tone(1175, 0.1, 0.4, "triangle", 0.3);
  }

  function playWrong() {
    tone(311, 0, 0.22, "square", 0.08, 277);
    tone(233, 0.2, 0.45, "square", 0.08, 165);
  }

  function playFanfare(stars) {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.3, "triangle", 0.25));
    if (stars === 3) tone(1319, 0.5, 0.7, "triangle", 0.22);
  }

  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  let spanishVoice = null;

  // Spaß- und Effektstimmen von iOS/macOS klingen roboterhaft und kommen ans Ende.
  const NOVELTY_VOICES = ["Eddy", "Flo", "Grandma", "Grandpa", "Oma", "Opa", "Abuela", "Abuelo", "Reed", "Rocko", "Sandy", "Shelley", "Albert", "Bahh", "Bells", "Boing", "Bubbles", "Cellos", "Jester", "Organ", "Superstar", "Trinoids", "Whisper", "Wobble", "Zarvox", "Fred", "Junior", "Kathy", "Ralph"];

  // "premium", "enhanced" oder "standard" – Premium/Erweitert klingen deutlich natürlicher.
  function voiceQuality(v) {
    const id = (v.name + " " + (v.voiceURI || "")).toLowerCase();
    if (id.includes("premium")) return "premium";
    if (/enhanced|erweitert|verbessert|neural|natural/.test(id)) return "enhanced";
    return "standard";
  }

  function voiceLang(v) {
    return v ? v.lang.replace("_", "-") : "es-ES";
  }

  function voiceScore(v) {
    let score = voiceLang(v) === "es-ES" ? 30 : 10;
    score += { premium: 25, enhanced: 15, standard: 0 }[voiceQuality(v)];
    if (NOVELTY_VOICES.some((n) => v.name.startsWith(n))) score -= 100;
    return score;
  }

  function spanishVoices() {
    if (!synth) return [];
    return synth.getVoices()
      .filter((v) => v.lang.toLowerCase().replace("_", "-").startsWith("es"))
      .sort((a, b) => voiceScore(b) - voiceScore(a));
  }

  function pickVoice() {
    const voices = spanishVoices();
    spanishVoice = voices.find((v) => v.voiceURI === state.voiceURI) || voices[0] || null;
  }

  if (synth) {
    pickVoice();
    // Stimmen laden auf iOS verzögert – dann Auswahl aktualisieren.
    synth.onvoiceschanged = () => {
      pickVoice();
      if (view === "settings") render();
    };
  }

  function speak(text, rate) {
    if (!synth || !state.sound) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    // Sprache und Stimme müssen zusammenpassen, sonst nimmt Safari die einfache Standardstimme.
    u.lang = voiceLang(spanishVoice);
    if (spanishVoice) u.voice = spanishVoice;
    u.rate = rate || 0.85;
    u.onstart = () => document.body.classList.add("speaking");
    u.onend = u.onerror = () => document.body.classList.remove("speaking");
    synth.speak(u);
  }

  // ---------- Podcast-Player ----------
  let player = null;
  let wakeLock = null;

  function hasGender(v, gender) {
    const names = gender === "m" ? MALE_VOICE_NAMES : FEMALE_VOICE_NAMES;
    return names.some((n) => v.name.includes(n));
  }

  // Jeder Sprecher bekommt eine möglichst gute, passende und noch freie Stimme.
  // Die Tonhöhe wird nie verstellt – das klingt unnatürlich.
  function podcastVoices(ep) {
    const good = spanishVoices().filter((v) => voiceScore(v) > 0);
    const main = spanishVoice;
    if (!ep.speakers) {
      const narrator = main && hasGender(main, ep.narrator) ? main : good.find((v) => hasGender(v, ep.narrator)) || main;
      return { narrator };
    }
    const used = new Set();
    const result = {};
    Object.entries(ep.speakers).forEach(([id, sp]) => {
      const candidates = [main, ...good].filter((v) => v && !used.has(v.voiceURI));
      const voice = candidates.find((v) => hasGender(v, sp.gender)) || candidates[0] || main;
      if (voice) used.add(voice.voiceURI);
      result[id] = voice;
    });
    return result;
  }

  function voiceSettings(ep, line) {
    const voices = podcastVoices(ep);
    return { voice: ep.speakers ? voices[line.s] : voices.narrator, pitch: 1 };
  }

  function baseSeconds(ep, upto) {
    return ep.lines.slice(0, upto).reduce((sum, l) => sum + l.es.split(/\s+/).length / 3.2 + 0.45, 0);
  }

  function episodeSeconds(ep, upto) {
    return baseSeconds(ep, upto) / PODCAST_RATES[state.podcastSpeed];
  }

  function formatTime(sec) {
    const s = Math.round(sec);
    return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
  }

  function openEpisode(id) {
    stopPlayer();
    const resumeAt = state.podcastPos[id] || 0;
    player = { id, index: resumeAt, playing: false, started: resumeAt > 0, finished: false, token: 0, xp: 0, newBadges: [] };
    view = "episode";
    render();
  }

  function rememberPosition() {
    if (player.finished) delete state.podcastPos[player.id];
    else state.podcastPos[player.id] = player.index;
    saveState();
  }

  function stopPlayer() {
    if (!player) return;
    if (player.started) rememberPosition();
    player.playing = false;
    player.token++;
    if (synth) synth.cancel();
    releaseWakeLock();
  }

  function playLine() {
    const p = player;
    const ep = PODCAST_BY_ID.get(p.id);
    const line = ep.lines[p.index];
    const token = ++p.token;
    if (synth.speaking || synth.pending) synth.cancel();
    const u = new SpeechSynthesisUtterance(line.es);
    const { voice, pitch } = voiceSettings(ep, line);
    u.lang = voiceLang(voice);
    if (voice) u.voice = voice;
    u.pitch = pitch;
    u.rate = PODCAST_RATES[state.podcastSpeed];
    u.onend = () => {
      if (player !== p || token !== p.token || !p.playing) return;
      if (p.index >= ep.lines.length - 1) {
        finishEpisode();
        return;
      }
      p.index++;
      rememberPosition();
      playLine();
      updatePlayer(true);
    };
    synth.speak(u);
  }

  function startPlaying() {
    const p = player;
    if (!state.sound) {
      state.sound = true;
      saveState();
    }
    p.playing = true;
    p.started = true;
    p.finished = false;
    requestWakeLock();
    playLine();
  }

  function togglePlay() {
    if (!synth) return;
    if (player.playing) {
      stopPlayer();
    } else {
      if (player.finished) player.index = 0;
      startPlaying();
    }
    updatePlayer(player.playing);
  }

  function jumpTo(i) {
    if (!synth) return;
    player.index = i;
    startPlaying();
    updatePlayer(false);
  }

  function step(delta) {
    const ep = PODCAST_BY_ID.get(player.id);
    player.index = Math.max(0, Math.min(ep.lines.length - 1, player.index + delta));
    player.finished = false;
    player.started = true;
    if (player.playing) playLine();
    updatePlayer(true);
  }

  function setSpeed(speed) {
    state.podcastSpeed = speed;
    saveState();
    if (player.playing) playLine();
    updatePlayer(false);
  }

  function finishEpisode() {
    const p = player;
    p.playing = false;
    p.finished = true;
    releaseWakeLock();
    p.xp = 0;
    delete state.podcastPos[p.id];
    if (!state.podcastsHeard.includes(p.id)) {
      state.podcastsHeard.push(p.id);
      p.goalReached = addXp(XP_EPISODE);
      p.xp = XP_EPISODE;
    }
    bumpStreak();
    p.newBadges = unlockBadges();
    saveState();
    render();
    playFanfare(p.xp ? 3 : 2);
    if (p.xp) confetti();
  }

  // Nur Teil-Updates, damit der Text beim Mitlesen nicht springt.
  function updatePlayer(scroll) {
    if (view !== "episode" || !player) return;
    const ep = PODCAST_BY_ID.get(player.id);
    const lines = app.querySelectorAll(".line");
    lines.forEach((el, i) => el.classList.toggle("active", player.started && i === player.index));
    const total = episodeSeconds(ep, ep.lines.length);
    const now = player.finished ? total : episodeSeconds(ep, player.index);
    app.querySelector(".pc-progress > span").style.width = (now / total) * 100 + "%";
    app.querySelector(".pc-now").textContent = formatTime(now);
    app.querySelector(".pc-total").textContent = formatTime(total);
    const resume = app.querySelector(".pc-resume");
    if (resume && player.playing) resume.remove();
    const main = app.querySelector(".pc-main");
    main.textContent = player.playing ? "⏸" : "▶";
    main.setAttribute("aria-label", player.playing ? "Pause" : "Abspielen");
    app.querySelectorAll(".speed").forEach((b) => b.classList.toggle("on", Number(b.dataset.speed) === state.podcastSpeed));
    if (scroll && lines[player.index]) lines[player.index].scrollIntoView({ block: "center", behavior: "smooth" });
  }

  async function requestWakeLock() {
    try {
      if ("wakeLock" in navigator && !wakeLock) {
        wakeLock = await navigator.wakeLock.request("screen");
        wakeLock.addEventListener("release", () => { wakeLock = null; });
      }
    } catch (e) {
      // Bildschirmsperre lässt sich nicht verhindern – die Wiedergabe läuft trotzdem.
    }
  }

  function releaseWakeLock() {
    if (wakeLock) wakeLock.release().catch(() => {});
    wakeLock = null;
  }

  // Im Hintergrund stoppt Safari die Sprachausgabe – dann sauber pausieren.
  document.addEventListener("visibilitychange", () => {
    if (document.hidden && player && player.playing) {
      stopPlayer();
      updatePlayer(false);
    }
  });

  function startQuiz(id) {
    const ep = PODCAST_BY_ID.get(id);
    stopPlayer();
    const tasks = ep.quiz.map((q, i) => ({ id: id + "|" + i, question: q.q, answer: q.a, wrong: q.wrong }));
    newSession("quiz", { episode: id, level: 2, queue: shuffle(tasks), total: tasks.length, task: null });
    view = "drill";
    nextTask();
  }

  // ---------- Sprechen ----------
  const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition || null;
  const canRecord = !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
  let recognizer = null;
  let recorder = null;

  // "auto": Spracherkennung prüft; "record": aufnehmen und selbst vergleichen; "self": nur selbst bewerten.
  function speakMode() {
    if (state.speakMode === "record" && canRecord) return "record";
    if (Recognition) return "auto";
    return canRecord ? "record" : "self";
  }

  function buildSpeakTasks(source) {
    if (source === "sounds") {
      return shuffle(SOUNDS.flatMap((snd) => snd.words.map((w) => ({ id: w.es, es: w.es, de: w.de, sound: snd.id })))).slice(0, SESSION_SIZE);
    }
    if (source === "sentences") {
      return shuffle(SENTENCES.slice()).slice(0, SESSION_SIZE).map((s) => ({ id: s.es, es: s.es, de: s.de }));
    }
    const seen = shuffle(VOCAB.filter((w) => isSeen(w.es)));
    const unseen = shuffle(VOCAB.filter((w) => !isSeen(w.es)));
    return shuffle([...seen.slice(0, 6), ...unseen, ...seen.slice(6)].slice(0, SESSION_SIZE))
      .map((w) => ({ id: w.es, es: w.es, de: w.de }));
  }

  function startSpeak(source) {
    if (!state.sound) {
      state.sound = true;
      saveState();
    }
    const tasks = buildSpeakTasks(source);
    newSession("speak", { source, level: state.speakLevel, queue: tasks, total: tasks.length, task: null, listening: false, interim: "", notice: "" });
    view = "drill";
    nextTask();
  }

  // Die Erkennung schreibt Zahlen oft als Ziffern („30“) – für den Vergleich werden sie zu Wörtern.
  function spokenWords(str) {
    const withWords = str.replace(/\d+/g, (d) => (Number(d) <= 100 ? numberWord(Number(d)) : d));
    return stripAccents(normalizeListen(withWords)).split(" ").filter(Boolean);
  }

  // Markiert jedes Wort des Zielsatzes, das (in richtiger Reihenfolge) erkannt wurde.
  function compareSpoken(target, heard) {
    const norm = target.split(/\s+/).map((tok) => spokenWords(tok).join(" "));
    const keys = norm.map((n, i) => ({ n, i })).filter((x) => x.n);
    const heardWords = spokenWords(heard);
    const a = keys.map((k) => k.n);
    const dp = Array.from({ length: a.length + 1 }, () => new Array(heardWords.length + 1).fill(0));
    for (let i = a.length - 1; i >= 0; i--) {
      for (let j = heardWords.length - 1; j >= 0; j--) {
        dp[i][j] = a[i] === heardWords[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
      }
    }
    const marks = norm.map((n) => !n);
    let i = 0;
    let j = 0;
    while (i < a.length && j < heardWords.length) {
      if (a[i] === heardWords[j]) {
        marks[keys[i].i] = true;
        i++;
        j++;
      } else if (dp[i + 1][j] >= dp[i][j + 1]) i++;
      else j++;
    }
    return { marks, matched: dp[0][0], total: a.length };
  }

  function evaluateSpeech(alternatives) {
    const t = session.task;
    let best = null;
    alternatives.forEach((alt) => {
      const r = compareSpoken(t.es, alt);
      if (!best || r.matched > best.matched) best = Object.assign(r, { heard: alt });
    });
    const ok = best.matched === best.total || (best.total >= 4 && best.matched / best.total >= 0.8);
    submitSpeak(ok, best.heard, best.marks);
  }

  function submitSpeak(ok, heard, marks) {
    const s = session;
    const t = s.task;
    const first = !s.firstTry.has(t.id);
    if (first) s.firstTry.set(t.id, ok);
    t.result = ok ? "right" : "wrong";
    t.heard = heard;
    t.marks = marks;
    if (ok) {
      reward(s, t.id, first ? XP_FIRST_TRY : XP_RETRY);
      playCorrect();
      setTimeout(() => {
        if (session === s && s.task === t) nextTask();
      }, 1800);
    } else {
      s.combo = 0;
      playWrong();
    }
    saveState();
    render();
  }

  // Falsche Aufgaben kommen einmal wieder, damit man nicht an einem Wort hängen bleibt.
  function speakGiveUp() {
    const s = session;
    const t = s.task;
    if (!s.firstTry.has(t.id)) s.firstTry.set(t.id, false);
    s.combo = 0;
    if (!t.base.requeued) {
      t.base.requeued = true;
      s.queue.splice(Math.min(3, s.queue.length), 0, t.base);
    }
    nextTask();
  }

  function micPressed() {
    const s = session;
    if (s.listening) {
      if (recognizer) recognizer.stop();
      if (recorder && recorder.state === "recording") recorder.stop();
      return;
    }
    if (synth) synth.cancel();
    s.notice = "";
    s.interim = "";
    s.task.result = null;
    if (speakMode() === "auto") startRecognition();
    else startRecording();
  }

  function startRecognition() {
    const s = session;
    const rec = new Recognition();
    recognizer = rec;
    rec.lang = "es-ES";
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    rec.continuous = false;
    let finalAlternatives = null;
    rec.onresult = (e) => {
      if (recognizer !== rec) return;
      const res = e.results[e.results.length - 1];
      s.interim = res[0].transcript;
      if (res.isFinal) finalAlternatives = Array.from(res, (alt) => alt.transcript);
      const el = app.querySelector(".interim");
      if (el) el.textContent = s.interim;
    };
    rec.onerror = (e) => {
      if (recognizer !== rec) return;
      if (e.error === "service-not-allowed" && canRecord) {
        state.speakMode = "record";
        saveState();
        s.notice = "Die Spracherkennung ist auf diesem Gerät nicht erlaubt – du übst jetzt mit Aufnahme und Vergleich. (Erlauben kannst du sie unter Einstellungen → Siri → Diktieren.)";
      } else if (e.error === "not-allowed") {
        s.notice = "Bitte erlaube den Zugriff aufs Mikrofon (Einstellungen → Safari → Mikrofon).";
      } else if (e.error === "no-speech") {
        s.notice = "Ich habe nichts gehört. Tippe nochmal aufs Mikrofon und sprich deutlich.";
      } else if (e.error !== "aborted") {
        s.notice = "Das hat nicht geklappt. Versuch es bitte nochmal.";
      }
    };
    rec.onend = () => {
      if (recognizer !== rec) return;
      recognizer = null;
      s.listening = false;
      const heard = finalAlternatives || (s.interim ? [s.interim] : null);
      if (heard && !s.notice) evaluateSpeech(heard);
      else {
        if (!s.notice) s.notice = "Ich habe nichts verstanden. Versuch es nochmal.";
        render();
      }
    };
    s.listening = true;
    render();
    try {
      rec.start();
    } catch (e) {
      recognizer = null;
      s.listening = false;
      s.notice = "Das Mikrofon ließ sich nicht starten.";
      render();
    }
  }

  async function startRecording() {
    const s = session;
    const t = s.task;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    } catch (e) {
      s.notice = "Kein Zugriff aufs Mikrofon. Erlaube ihn unter Einstellungen → Safari → Mikrofon.";
      render();
      return;
    }
    if (session !== s || s.task !== t) {
      stream.getTracks().forEach((track) => track.stop());
      return;
    }
    const chunks = [];
    const rec = new MediaRecorder(stream);
    recorder = rec;
    rec.ondataavailable = (e) => {
      if (e.data.size) chunks.push(e.data);
    };
    rec.onstop = () => {
      stream.getTracks().forEach((track) => track.stop());
      if (recorder === rec) recorder = null;
      if (rec.aborted || session !== s || s.task !== t) return;
      s.listening = false;
      if (t.recordingUrl) URL.revokeObjectURL(t.recordingUrl);
      t.recordingUrl = URL.createObjectURL(new Blob(chunks, { type: rec.mimeType || "audio/mp4" }));
      render();
      playRecording();
    };
    rec.start();
    s.listening = true;
    render();
    setTimeout(() => {
      if (recorder === rec && rec.state === "recording") rec.stop();
    }, 8000);
  }

  function playRecording() {
    const t = session.task;
    if (t.recordingUrl) new Audio(t.recordingUrl).play().catch(() => {});
  }

  function abortListening() {
    if (recognizer) {
      const rec = recognizer;
      recognizer = null;
      try {
        rec.abort();
      } catch (e) {
        // war schon beendet
      }
    }
    if (recorder) {
      const rec = recorder;
      recorder = null;
      rec.aborted = true;
      if (rec.state === "recording") rec.stop();
    }
    if (session) session.listening = false;
  }

  // ---------- Effekte ----------
  function floatText(parent, text) {
    const el = document.createElement("div");
    el.className = "xp-float";
    el.textContent = text;
    parent.appendChild(el);
  }

  function restartAnimation(el, cls) {
    el.classList.remove("enter", cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function confetti() {
    const colors = ["#E4572E", "#F6B519", "#22B573", "#3A86FF", "#FF6B9A", "#9B5DE5"];
    const wrap = document.createElement("div");
    wrap.className = "confetti";
    for (let i = 0; i < 90; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * 0.6 + "s";
      p.style.animationDuration = 2 + Math.random() * 1.5 + "s";
      wrap.appendChild(p);
    }
    document.body.appendChild(wrap);
    setTimeout(() => wrap.remove(), 4500);
  }

  // ---------- Ansichten ----------
  // ---------- Übersetzer ----------
  // Online-Übersetzung über MyMemory (kostenlos, ohne Konto). Einzelne Wörter kommen zuerst
  // aus dem geprüften Poquito-Wörterbuch – das klappt auch ohne Internet.
  const MT_URL = "https://api.mymemory.translated.net/get";
  const HISTORY_KEY = STORAGE_KEY + "_verlauf";
  const MAX_INPUT = 1000;
  const MAX_CARD = 80;
  const LANG_NAMES = { de: "🇩🇪 Deutsch", es: "🇪🇸 Spanisch" };
  const ARTICLES = /^(el|la|los|las|un|una|unos|unas|der|die|das|den|dem|des|ein|eine|einen|einem|einer) /;
  const ES_HINTS = new Set("el la los las un una y o de del que en está estoy soy eres son muy pero por para con sin mi tu su yo tú usted qué cómo dónde cuándo hola gracias buenos buenas días no sí también hay tengo quiero puedo me te se lo le al".split(" "));
  const DE_HINTS = new Set("der die das den dem ein eine einen und oder ist bin bist sind nicht ich du er sie wir ihr mit von zu im auf für aber auch wie was wo wann hallo danke bitte guten tag gut sehr kein keine haben habe hast möchte kann".split(" "));
  const translator = { text: "", result: null, loading: false, error: "", note: "", token: 0 };

  function trLangs(dir) {
    return dir === "es-de" ? ["es", "de"] : ["de", "es"];
  }

  // Vergleichsformen: klein und ohne Satzzeichen (simple), zusätzlich ohne Akzente (plain)
  function simple(str) {
    return str.toLowerCase().replace(/[¿?¡!.,;:"'«»()…]/g, " ").replace(/\s+/g, " ").trim();
  }

  function plain(str) {
    return stripAccents(simple(str));
  }

  function sameMeaning(a, b) {
    return plain(a).replace(ARTICLES, "") === plain(b).replace(ARTICLES, "");
  }

  function variants(text) {
    return text.replace(/\([^)]*\)/g, " ").split("/").map(simple).filter(Boolean)
      .flatMap((v) => [v, v.replace(ARTICLES, "")]);
  }

  function dictionary() {
    const entries = new Map();
    VOCAB.forEach((w) => entries.set(w.es, { es: w.es, de: w.de, cat: w.cat }));
    VERBS.forEach((v) => entries.set(v.inf, Object.assign(entries.get(v.inf) || { es: v.inf, de: v.de }, { verb: v })));
    MY_CAT.words.forEach((w) => entries.set(w.es, { es: w.es, de: w.de, cat: MY_CAT.id }));
    return [...entries.values()];
  }

  function lookupDictionary(text, from) {
    if (!text.trim() || text.trim().split(/\s+/).length > 4) return [];
    const keys = new Set(variants(text));
    const loose = new Set([...keys].map(stripAccents));
    const exact = [];
    const near = [];
    dictionary().forEach((e) => {
      const vs = variants(from === "es" ? e.es : e.de);
      if (vs.some((v) => keys.has(v))) exact.push(e);
      else if (vs.some((v) => loose.has(stripAccents(v)))) near.push(e);
    });
    return (exact.length ? exact : near).slice(0, 3);
  }

  let formIndex = null;

  // Alle Formen der Poquito-Verben, um z. B. „tengo“ als tener · Presente · yo zu erkennen.
  function verbForms() {
    if (!formIndex) {
      formIndex = new Map();
      VERBS.forEach((v) => TENSES.forEach((t) => conj(v, t.id).forEach((form, person) => {
        const key = form.toLowerCase();
        if (!formIndex.has(key)) formIndex.set(key, []);
        formIndex.get(key).push({ v, tense: t.id, person });
      })));
    }
    return formIndex;
  }

  function grammarHints(text) {
    const key = simple(text);
    if (!key || key.split(" ").length > 3) return [];
    const inf = VERB_BY_INF.get(key);
    if (inf) return [{ v: inf, tense: null, persons: [] }];
    const groups = new Map();
    (verbForms().get(key) || []).forEach((h) => {
      const id = h.v.inf + "|" + h.tense;
      if (!groups.has(id)) groups.set(id, { v: h.v, tense: h.tense, persons: [] });
      groups.get(id).persons.push(personsFor(h.tense)[h.person]);
    });
    return [...groups.values()].slice(0, 4);
  }

  function guessLang(text) {
    const t = text.toLowerCase();
    let es = /[ñ¿¡]/.test(t) ? 3 : 0;
    let de = /[äöüß]/.test(t) ? 3 : 0;
    if (/[áéíóú]/.test(t)) es += 2;
    t.split(/[^a-záéíóúñüäöß]+/).forEach((w) => {
      if (ES_HINTS.has(w)) es++;
      if (DE_HINTS.has(w)) de++;
    });
    if (es === 0 && de === 0) {
      // Einzelne Wörter: Welche Sprache kennt das Wörterbuch?
      const inEs = lookupDictionary(text, "es").length > 0;
      const inDe = lookupDictionary(text, "de").length > 0;
      if (inEs !== inDe) return inEs ? "es" : "de";
      return null;
    }
    if (es >= de + 2 || (es > 0 && de === 0)) return "es";
    if (de >= es + 2 || (de > 0 && es === 0)) return "de";
    return null;
  }

  function decodeEntities(str) {
    const el = document.createElement("textarea");
    el.innerHTML = str;
    return el.value;
  }

  function byteLength(str) {
    return new TextEncoder().encode(str).length;
  }

  // Der Dienst nimmt höchstens 500 Byte pro Anfrage – längere Texte satzweise aufteilen.
  function chunkText(text) {
    const pieces = [];
    (text.match(/[^.!?…\n]+[.!?…]*\s*|\n+/g) || [text]).forEach((sentence) => {
      if (byteLength(sentence) <= 450) {
        pieces.push(sentence);
        return;
      }
      let part = "";
      sentence.split(/(\s+)/).forEach((word) => {
        if (part && byteLength(part + word) > 450) {
          pieces.push(part);
          part = "";
        }
        part += word;
      });
      if (part) pieces.push(part);
    });
    const chunks = [];
    let current = "";
    pieces.forEach((piece) => {
      if (current && byteLength(current + piece) > 450) {
        chunks.push(current);
        current = "";
      }
      current += piece;
    });
    if (current) chunks.push(current);
    return chunks.map((c) => c.trim()).filter(Boolean);
  }

  async function fetchMt(chunk, from, to) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 12000);
    try {
      const res = await fetch(MT_URL + "?q=" + encodeURIComponent(chunk) + "&langpair=" + from + "|" + to, { signal: ctrl.signal });
      if (res.status === 429) throw new Error("quota");
      if (!res.ok) throw new Error("http");
      const data = await res.json();
      const main = data.responseData && data.responseData.translatedText;
      if (data.quotaFinished || /MYMEMORY WARNING|ALL AVAILABLE FREE/i.test(main || "")) throw new Error("quota");
      if (Number(data.responseStatus) !== 200 || !main) throw new Error("http");
      return data;
    } finally {
      clearTimeout(timer);
    }
  }

  // Neuronale Übersetzung („MT!“) ist meist besser als Treffer aus dem Übersetzungsspeicher.
  function mtCandidates(data, chunk) {
    const target = plain(chunk);
    const ownSegment = (data.matches || []).filter((m) => m.translation && plain(m.segment || "") === target && Number(m.match) >= 0.7);
    const mt = ownSegment.filter((m) => m["created-by"] === "MT!");
    const tm = ownSegment.filter((m) => m["created-by"] !== "MT!");
    const endsWithPunct = /[.!?]$/.test(chunk.trim());
    return [...mt.map((m) => m.translation), data.responseData.translatedText, ...tm.map((m) => m.translation)]
      .map((t) => decodeEntities(t).trim())
      .map((t) => (endsWithPunct ? t : t.replace(/\.+$/, "").trim()))
      .filter(Boolean);
  }

  function uniqueTexts(list) {
    const out = [];
    list.forEach((t) => {
      if (t && !out.some((o) => sameMeaning(o, t))) out.push(t);
    });
    return out;
  }

  async function translate() {
    const text = translator.text.trim();
    if (!text || translator.loading) return;
    let [from, to] = trLangs(state.translateDir);
    translator.note = "";
    translator.error = "";
    const guessed = guessLang(text);
    if (guessed && guessed !== from) {
      state.translateDir = guessed === "es" ? "es-de" : "de-es";
      saveState();
      [from, to] = trLangs(state.translateDir);
      translator.note = "Sprache automatisch erkannt: " + LANG_NAMES[from] + " → " + LANG_NAMES[to];
    }
    const dict = lookupDictionary(text, from);
    const token = ++translator.token;
    translator.loading = true;
    translator.result = null;
    render();

    let online = [];
    let failure = null;
    try {
      if (navigator.onLine === false) throw new Error("offline");
      const chunks = chunkText(text);
      const parts = [];
      for (const chunk of chunks) {
        const candidates = mtCandidates(await fetchMt(chunk, from, to), chunk);
        parts.push(candidates[0]);
        if (chunks.length === 1) online = candidates;
      }
      if (chunks.length > 1) online = [parts.join(" ")];
    } catch (e) {
      failure = e;
    }
    if (token !== translator.token) return;
    translator.loading = false;

    // Kurze Eingaben: Das geprüfte Wörterbuch geht vor, die Online-Treffer werden zu Alternativen.
    const short = text.split(/\s+/).length <= 3;
    const fromDict = dict.map((e) => (to === "es" ? e.es : e.de));
    const all = uniqueTexts(short ? [...fromDict, ...online] : [...online, ...fromDict]);
    if (all.length) {
      translator.result = {
        dir: state.translateDir, from, to, source: text,
        main: all[0], alts: all.slice(1, 4), dict,
        hints: grammarHints(from === "es" ? text : all[0]),
      };
      addHistory(translator.result);
      if (failure) translator.note = "Ohne Internet – die Übersetzung stammt aus dem Poquito-Wörterbuch.";
    } else if (failure) {
      translator.error = failure.message === "quota"
        ? "Das kostenlose Tageskontingent für Übersetzungen ist aufgebraucht. Morgen geht es wieder – Wörter aus dem Poquito-Wörterbuch funktionieren weiterhin."
        : failure.message === "offline" || failure.name === "TypeError"
          ? "Keine Internetverbindung – für ganze Sätze braucht der Übersetzer Internet."
          : "Die Übersetzung hat gerade nicht geklappt. Versuch es gleich nochmal.";
    }
    if (view === "translate") render();
  }

  function loadHistory() {
    try {
      const list = JSON.parse(localStorage.getItem(HISTORY_KEY));
      return Array.isArray(list) ? list : [];
    } catch (e) {
      return [];
    }
  }

  function addHistory(r) {
    const list = loadHistory().filter((h) => !(h.source === r.source && h.dir === r.dir));
    list.unshift({ dir: r.dir, source: r.source, main: r.main, alts: r.alts, at: Date.now() });
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(list.slice(0, 30)));
    } catch (e) {
      // Verlauf ist nur Komfort.
    }
  }

  function showHistory(i) {
    const h = loadHistory()[i];
    if (!h) return;
    const [from, to] = trLangs(h.dir);
    state.translateDir = h.dir;
    saveState();
    translator.text = h.source;
    translator.error = "";
    translator.note = "";
    translator.result = {
      dir: h.dir, from, to, source: h.source, main: h.main, alts: h.alts || [],
      dict: lookupDictionary(h.source, from), hints: grammarHints(from === "es" ? h.source : h.main),
    };
    render();
    window.scrollTo(0, 0);
  }

  // Karteikarte: immer Spanisch vorne, Deutsch hinten
  function cardPair(r) {
    return r.from === "es" ? { es: r.source, de: r.main } : { es: r.main, de: r.source };
  }

  function saveMyWord() {
    const r = translator.result;
    if (!r) return;
    const pair = cardPair(r);
    if (pair.es.length > MAX_CARD || pair.de.length > MAX_CARD || WORDS.has(pair.es)) return;
    state.myWords.push({ es: pair.es, de: pair.de, added: Date.now() });
    registerMyWords(state.myWords);
    saveState();
    playCorrect();
    render();
  }

  function removeMyWord(es) {
    state.myWords = state.myWords.filter((w) => w.es !== es);
    registerMyWords(state.myWords);
    state.wrongStack = state.wrongStack.filter((id) => id !== es);
    saveState();
    render();
  }

  function copyText(text, button) {
    const done = () => {
      button.textContent = "✓ Kopiert";
      setTimeout(() => { button.textContent = "📋 Kopieren"; }, 1500);
    };
    const fallback = () => {
      const area = document.createElement("textarea");
      area.value = text;
      document.body.appendChild(area);
      area.select();
      try {
        document.execCommand("copy");
        done();
      } catch (e) {
        // Dann eben nicht.
      }
      area.remove();
    };
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
    else fallback();
  }

  // ---------- Schreiben: Analyse & Bewertung ----------
  // Rechtschreibung und Grammatik prüft LanguageTool (kostenlos, ohne Konto);
  // Zeitformen, Umfang und Ausdruck wertet Poquito selbst aus.
  const LT_URL = "https://api.languagetool.org/v2/check";
  const WRITE_KEY = STORAGE_KEY + "_schreiben";
  const WRITE_HISTORY_KEY = STORAGE_KEY + "_texte";
  const WRITE_FOCUS = [...TENSES.map((t) => t.id), "frei"];
  const MAX_WRITE_STARS = WRITE_FOCUS.length * 3;
  const MAX_WRITE_CHARS = 2000;
  const NOT_VERBS = new Set("qué café bebé josé sofá mamá papá día tía todavía policía alegría compañía mía tuya suya guía vía energía para cara clara rara primera tercera cualquiera ahí allí aquí así sí mí además después jamás quizá según también".split(" "));
  const CLITICS = /(?:selo|sela|selos|selas|melo|mela|telo|tela|me|te|se|lo|la|los|las|le|les|nos)$/;

  function vowelPlain(str) {
    return str.replace(/[áéíóú]/g, (c) => "aeiou"["áéíóú".indexOf(c)]);
  }

  let writeIndex = null;

  function writeVerbIndex() {
    if (writeIndex) return writeIndex;
    const forms = new Map();
    const parts = new Set();
    const infinitives = new Set();
    const simple = TENSES.map((t) => t.id).filter((id) => id !== "perfecto" && id !== "pluscuamperfecto");
    [...VERBS, ...EXTRA_VERBS].forEach((v) => {
      if (infinitives.has(v.inf)) return;
      infinitives.add(v.inf);
      parts.add(participio(v));
      simple.forEach((tense) => conj(v, tense).forEach((form) => {
        const key = form.toLowerCase();
        if (!forms.has(key)) forms.set(key, new Set());
        forms.get(key).add(tense);
      }));
    });
    const nouns = new Set();
    VOCAB.forEach((w) => {
      const m = w.es.toLowerCase().match(/^(?:el|la|los|las) (\S+)$/);
      if (m) nouns.add(m[1]);
    });
    writeIndex = { forms, parts, infinitives, nouns };
    return writeIndex;
  }

  // Zeitform einer unbekannten Verbform an ihrer Endung erkennen (nur eindeutige Endungen)
  function tenseBySuffix(word, index) {
    if (word.length < 4 || NOT_VERBS.has(word) || index.nouns.has(word) || index.nouns.has(word.replace(/e?s$/, ""))) return null;
    const cond = word.match(/^(.+[aei]r)(?:ía|ías|íamos|íais|ían)$/);
    if (cond) {
      // „-ería“ ist oft ein Geschäft (panadería) – nur zählen, wenn das Verb bekannt ist
      if (!/er(?:ía|ías|íamos|íais|ían)$/.test(word) || index.infinitives.has(cond[1])) return "condicional";
      return null;
    }
    if (/[aei]r(?:é|ás|á|emos|éis|án)$/.test(word)) return "futuro";
    if (/(?:aba|abas|ábamos|abais|aban)$/.test(word)) return "imperfecto";
    if (/(?:ía|ías|íamos|íais|ían)$/.test(word)) return "imperfecto";
    if (/(?:ieras?|iéramos|ierais|ieran|iese|iesen)$/.test(word)) return "subjImperfecto";
    if (/(?:aras|áramos|arais|aran)$/.test(word) && index.infinitives.has(word.replace(/(?:aras|áramos|arais|aran)$/, "ar"))) return "subjImperfecto";
    if (/(?:aste|asteis|aron|iste|isteis|ieron|ió)$/.test(word)) return "indefinido";
    if (/[^aeiouáéíóú][óé]$/.test(word)) return "indefinido";
    return null;
  }

  // Findet die Verbformen im Text und ordnet sie Zeitformen zu.
  function findTenses(text, focus) {
    const index = writeVerbIndex();
    const words = text.toLowerCase().match(/[a-záéíóúüñ]+/g) || [];
    const found = new Map();
    const add = (tense, form) => {
      if (!found.has(tense)) found.set(tense, []);
      if (!found.get(tense).includes(form)) found.get(tense).push(form);
    };
    for (let i = 0; i < words.length; i++) {
      const w = words[i];
      const next = words[i + 1];
      const isPart = next && (index.parts.has(next) || /(?:ado|ido)$/.test(next));
      if (isPart && HABER_PRES.includes(w)) {
        add("perfecto", w + " " + next);
        i++;
        continue;
      }
      if (isPart && HABER_IMPF.includes(w)) {
        add("pluscuamperfecto", w + " " + next);
        i++;
        continue;
      }
      let tenses = index.forms.get(w);
      if (!tenses && CLITICS.test(w)) {
        const base = vowelPlain(w.replace(CLITICS, ""));
        const imp = index.forms.get(base);
        if (base.length >= 2 && imp && imp.has("imperativo")) tenses = new Set(["imperativo"]);
      }
      if (tenses) {
        add(tenses.has(focus) ? focus : [...tenses][0], w);
        continue;
      }
      if (words[i - 1] === "yo" && w.length > 2 && w.endsWith("o")) {
        add("presente", w);
        continue;
      }
      const guess = tenseBySuffix(w, index);
      if (guess) add(guess, w);
    }
    return found;
  }

  function textStats(text) {
    const sentences = text.split(/[.!?…]+|\n+/)
      .map((part) => part.trim())
      .filter((part) => (part.match(/[a-záéíóúüñ]+/gi) || []).length >= 2);
    const words = text.toLowerCase().match(/[a-záéíóúüñ]+/g) || [];
    const content = words.filter((w) => w.length >= 3);
    const variety = content.length ? new Set(content).size / content.length : 0;
    const plainText = " " + words.join(" ") + " ";
    const connectors = CONNECTORS.filter((c) => plainText.includes(" " + c + " "));
    return { sentences: sentences.length, words: words.length, avgLen: sentences.length ? words.length / sentences.length : 0, variety, connectors };
  }

  async function checkSpanish(text) {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), 15000);
    try {
      const res = await fetch(LT_URL, { method: "POST", body: new URLSearchParams({ text, language: "es" }), signal: ctrl.signal });
      if (!res.ok) throw new Error("http");
      const data = await res.json();
      return data.matches || [];
    } finally {
      clearTimeout(timer);
    }
  }

  function issueKind(m) {
    const type = (m.rule && m.rule.issueType) || "";
    const cat = (m.rule && m.rule.category && m.rule.category.id) || "";
    if (type === "misspelling" || cat === "TYPOS" || cat === "DIACRITICS") return "spelling";
    if (type === "typographical" || type === "whitespace" || ["TYPOGRAPHY", "PUNCTUATION", "CASING"].includes(cat)) return "punct";
    if (type === "style" || type === "locale-violation" || ["STYLE", "REDUNDANCY"].includes(cat)) return "style";
    return "grammar";
  }

  const ISSUE_NAMES = { spelling: "Rechtschreibung", grammar: "Grammatik", punct: "Zeichensetzung", style: "Stil-Tipp" };

  function explainIssue(id, wrong, fix, kind) {
    const w = wrong.toLowerCase();
    const f = (fix || "").toLowerCase();
    if (fix && f !== w && stripAccents(f) === stripAccents(w)) return "Akzent fehlt oder ist falsch";
    if (fix && f === w && fix !== wrong) return "Groß- und Kleinschreibung";
    if (/QUESTION|EXCLAMATION|INTERROG/.test(id) || /[¿¡]/.test(fix || "")) return "Fragen beginnen mit ¿, Ausrufe mit ¡";
    if (/AGREEMENT|CONCORD/.test(id)) return /VERB|SUBJECT/.test(id) ? "Verbform passt nicht zur Person" : "Geschlecht oder Anzahl passen nicht zusammen";
    return ISSUE_NAMES[kind];
  }

  // Bei mehreren Vorschlägen den nehmen, der dein Hauptwort behält („mi amigos“ → „mis amigos“, nicht „mi amigo“).
  function bestFix(wrong, options) {
    const last = wrong.toLowerCase().split(/\s+/).pop();
    if (options.length > 1 && /\s/.test(wrong)) {
      const keeps = options.find((o) => o.toLowerCase().split(/\s+/).pop() === last);
      if (keeps) return keeps;
    }
    return options[0] || "";
  }

  function toIssues(text, matches) {
    return matches.map((m) => {
      const wrong = text.substr(m.offset, m.length);
      const options = (m.replacements || []).map((r) => r.value).slice(0, 5);
      const fix = bestFix(wrong, options);
      const alt = options.find((o) => o !== fix) || "";
      const kind = issueKind(m);
      const id = (m.rule && m.rule.id) || "";
      return { offset: m.offset, length: m.length, wrong, fix, alt, kind, label: explainIssue(id, wrong, fix, kind), message: m.message || "" };
    });
  }

  const QUESTION_WORDS = { que: "qué", como: "cómo", donde: "dónde", cuando: "cuándo", cuanto: "cuánto", cuanta: "cuánta", cuantos: "cuántos", cuantas: "cuántas", quien: "quién", quienes: "quiénes", cual: "cuál", cuales: "cuáles" };

  // Fragewörter am Anfang einer Frage/eines Ausrufs brauchen einen Akzent (¿Cómo …? ¡Qué …!).
  // Wünsche wie „¡Que tengas un buen día!“ bleiben ohne Akzent.
  function addQuestionWordIssues(text, issues) {
    const re = /(^|[.!?…]\s+|[¿¡]\s*)([a-záéíóúA-ZÁÉÍÓÚ]+)([^.!?…]*)([?!])/g;
    let m;
    while ((m = re.exec(text))) {
      re.lastIndex = m.index + m[0].length - 1;
      const word = m[2];
      const accented = QUESTION_WORDS[word.toLowerCase()];
      if (!accented) continue;
      const nextWord = (m[3].trim().split(/\s+/)[0] || "").toLowerCase();
      if (accented === "qué" && (findTenses(nextWord, "subjuntivo").has("subjuntivo") || ["te", "le", "lo", "les", "os", "se"].includes(nextWord))) continue;
      const fixedWord = word[0] === word[0].toUpperCase() ? accented[0].toUpperCase() + accented.slice(1) : accented;
      const offset = m.index + m[1].length;
      const existing = issues.find((i) => i.offset <= offset && i.offset + i.length >= offset + word.length);
      if (existing) {
        existing.fix = (existing.fix || existing.wrong).replace(word, fixedWord);
        existing.label += " – und Fragewörter tragen einen Akzent";
      } else {
        issues.push({ offset, length: word.length, wrong: word, fix: fixedWord, alt: "", kind: "spelling", label: "Fragewörter tragen einen Akzent (qué, cómo, dónde …)", message: "" });
      }
    }
    return issues;
  }

  // Korrigierte Fassung: Vorschläge von hinten nach vorn einsetzen (ohne Stil-Tipps)
  function correctedText(text, issues) {
    let out = text;
    let limit = Infinity;
    [...issues].sort((a, b) => b.offset - a.offset).forEach((i) => {
      if (i.kind === "style" || !i.fix || i.offset + i.length > limit) return;
      out = out.slice(0, i.offset) + i.fix + out.slice(i.offset + i.length);
      limit = i.offset;
    });
    return out;
  }

  function rating(points, good, ok) {
    if (points >= good) return { level: "good", text: "gut" };
    if (points >= ok) return { level: "ok", text: "okay" };
    return { level: "work", text: "üben" };
  }

  function evaluateWriting(text, focus, topic, issues) {
    const stats = textStats(text);
    const found = findTenses(text, focus);
    const focusForms = found.get(focus) || [];
    const tensesUsed = [...found.keys()];

    let correctness = null;
    let errors = 0;
    if (issues) {
      const count = (k) => issues.filter((i) => i.kind === k).length;
      errors = count("spelling") + count("grammar") + count("punct");
      const weighted = count("spelling") + count("grammar") + 0.5 * count("punct");
      const per100 = (weighted / Math.max(stats.words, 1)) * 100;
      correctness = per100 <= 2 ? 50 : per100 <= 5 ? 40 : per100 <= 9 ? 28 : per100 <= 14 ? 16 : 6;
    }
    const tenseCount = focus === "frei" ? tensesUsed.length : focusForms.length;
    const tensePts = tenseCount >= 2 ? 25 : tenseCount === 1 ? 14 : 0;
    const inRange = stats.sentences >= WRITE_SENTENCES.min && stats.sentences <= WRITE_SENTENCES.max;
    const nearRange = stats.sentences >= WRITE_SENTENCES.min - 1 && stats.sentences <= WRITE_SENTENCES.max + 2;
    const expr = (inRange ? 8 : nearRange ? 4 : 0)
      + (stats.avgLen >= 6 ? 5 : stats.avgLen >= 4 ? 3 : 0)
      + (stats.connectors.length >= 2 ? 6 : stats.connectors.length === 1 ? 3 : 0)
      + (stats.variety >= 0.65 ? 6 : stats.variety >= 0.5 ? 3 : 0);

    const total = correctness === null ? ((tensePts + expr) / 50) * 100 : correctness + tensePts + expr;
    let stars = total >= 80 ? 3 : total >= 55 ? 2 : 1;
    const tooShort = stats.sentences < WRITE_SENTENCES.min - 1 || stats.words < 20;
    if (tooShort) stars = 1;
    if (correctness === null) stars = Math.min(stars, 2);

    const tense = focus === "frei" ? null : TENSE_BY_ID.get(focus);
    const good = [];
    const tips = [];
    if (issues && errors === 0) good.push("Keine Rechtschreib- oder Grammatikfehler gefunden – ¡Perfecto!");
    if (tense && focusForms.length) good.push(`${focusForms.length}× ${tense.name}: ${focusForms.slice(0, 5).join(", ")}`);
    if (!tense && tensesUsed.length >= 2) good.push("Abwechslungsreich: " + tensesUsed.map((id) => TENSE_BY_ID.get(id).name).join(", "));
    if (stats.connectors.length >= 2) good.push("Gute Verbindungswörter: " + stats.connectors.slice(0, 4).join(", "));
    const topicWords = topic.words.map((w) => w[0]).filter((es) => simple(text).includes(stripArticle(es)));
    if (topicWords.length) good.push("Themenwörter benutzt: " + topicWords.slice(0, 4).join(", "));

    if (tooShort) tips.push(`Schreib ${WRITE_SENTENCES.min}–${WRITE_SENTENCES.max} Sätze – dann kann Poquito dich richtig bewerten.`);
    if (tense && !focusForms.length) tips.push(`Ich habe kein ${tense.name} gefunden. Versuch es z. B. so: „${topic.starter}“`);
    if (tense && focusForms.length === 1) tips.push(`Benutze das ${tense.name} noch ein- oder zweimal mehr.`);
    if (issues && issues.some((i) => i.label.startsWith("Akzent"))) tips.push("Achte auf die Akzente – sie verändern oft die Bedeutung (esta ≠ está).");
    if (issues && issues.some((i) => i.label.startsWith("Fragen"))) tips.push("Fragen und Ausrufe bekommen im Spanischen auch vorne ein Zeichen: ¿…? und ¡…!");
    if (stats.connectors.length < 2 && !tooShort) tips.push("Verbinde deine Sätze mit y, pero, porque, después oder también.");
    if (stats.avgLen < 5 && !tooShort) tips.push("Deine Sätze sind recht kurz – verbinde zwei Gedanken zu einem Satz.");
    if (stats.variety < 0.5 && stats.words >= 20) tips.push("Einige Wörter wiederholen sich oft – probier ein paar Alternativen.");

    return {
      stars,
      stats,
      found: [...found.entries()],
      focusForms,
      errors,
      issues: issues || [],
      checked: !!issues,
      corrected: issues ? correctedText(text, issues) : text,
      cats: [
        { name: "Rechtschreibung & Grammatik", ...(correctness === null ? { level: "none", text: "nicht geprüft" } : rating(correctness, 40, 28)),
          detail: correctness === null ? "Ohne Internet konnte das nicht geprüft werden." : errors ? `${errors} Fehler gefunden` : "fehlerfrei" },
        { name: tense ? "Zeitform: " + tense.name : "Zeitformen", ...rating(tensePts, 25, 14),
          detail: tense ? (focusForms.length ? focusForms.length + "× benutzt" : "nicht gefunden") : tensesUsed.length + " verschiedene" },
        { name: "Umfang & Ausdruck", ...rating(expr, 19, 11),
          detail: `${stats.sentences} Sätze · ${stats.words} Wörter` },
      ],
      good: good.slice(0, 3),
      tips: tips.slice(0, 3),
    };
  }

  function stripArticle(es) {
    return simple(es).replace(ARTICLES, "");
  }

  // ---------- Schreiben: Ablauf ----------
  const writing = loadWriting();

  function loadWriting() {
    const base = { id: 0, focus: "presente", topic: null, text: "", awarded: 0, result: null, checking: false, error: "" };
    let saved = null;
    try {
      saved = JSON.parse(localStorage.getItem(WRITE_KEY));
    } catch (e) {
      saved = null;
    }
    if (!saved || typeof saved !== "object") return base;
    return Object.assign(base, {
      id: saved.id || 0,
      focus: WRITE_FOCUS.includes(saved.focus) ? saved.focus : "presente",
      topic: WRITE_TOPICS[saved.topic] ? saved.topic : null,
      text: typeof saved.text === "string" ? saved.text : "",
      awarded: saved.awarded || 0,
    });
  }

  // Entwurf sofort sichern – nichts geht verloren, wenn die App geschlossen wird.
  function saveWriting() {
    try {
      localStorage.setItem(WRITE_KEY, JSON.stringify({ id: writing.id, focus: writing.focus, topic: writing.topic, text: writing.text, awarded: writing.awarded }));
    } catch (e) {
      // Ohne Speicher eben ohne Entwurf.
    }
  }

  function startWriting(focus) {
    const unsaved = writing.topic !== null && !writing.awarded && writing.text.trim().length > 20;
    if (unsaved && !confirm("Dein angefangener Text wird verworfen. Neues Thema würfeln?")) return;
    const pool = WRITE_TOPICS.map((t, i) => i).filter((i) => (focus === "frei" || WRITE_TOPICS[i].tense === focus) && i !== writing.topic);
    Object.assign(writing, { id: Date.now(), focus, topic: pool[Math.floor(Math.random() * pool.length)], text: "", awarded: 0, result: null, error: "" });
    saveWriting();
    go("compose");
  }

  function loadWriteHistory() {
    try {
      const list = JSON.parse(localStorage.getItem(WRITE_HISTORY_KEY));
      return Array.isArray(list) ? list.filter((h) => WRITE_TOPICS[h.topic]) : [];
    } catch (e) {
      return [];
    }
  }

  function saveWriteHistory(stars) {
    const list = loadWriteHistory().filter((h) => h.id !== writing.id);
    list.unshift({ id: writing.id, at: Date.now(), focus: writing.focus, topic: writing.topic, text: writing.text, stars });
    try {
      localStorage.setItem(WRITE_HISTORY_KEY, JSON.stringify(list.slice(0, 20)));
    } catch (e) {
      // Verlauf ist nur Komfort.
    }
  }

  function openWriteHistory(i) {
    const h = loadWriteHistory()[i];
    if (!h) return;
    Object.assign(writing, { id: h.id, focus: h.focus, topic: h.topic, text: h.text, awarded: h.stars, result: null, error: "" });
    saveWriting();
    go("compose");
  }

  function writeCountText(text) {
    const stats = textStats(text);
    return `${stats.sentences} ${stats.sentences === 1 ? "Satz" : "Sätze"} (Ziel ${WRITE_SENTENCES.min}–${WRITE_SENTENCES.max}) · ${stats.words} Wörter`;
  }

  async function checkWriting() {
    const text = writing.text.trim();
    if (!text || writing.checking) return;
    if (guessLang(text) === "de") {
      writing.error = "Das sieht nach Deutsch aus – schreib bitte auf Spanisch 😉";
      render();
      return;
    }
    writing.checking = true;
    writing.error = "";
    render();
    let issues = null;
    try {
      issues = addQuestionWordIssues(text, toIssues(text, await checkSpanish(text)));
    } catch (e) {
      issues = null;
    }
    writing.checking = false;
    const r = evaluateWriting(text, writing.focus, WRITE_TOPICS[writing.topic], issues);
    r.text = text;
    r.startXp = state.xp;
    // XP gibt es beim ersten Prüfen – nach dem Überarbeiten nur noch für zusätzliche Sterne.
    r.xp = writing.awarded ? 5 * Math.max(0, r.stars - writing.awarded) : XP_WRITE + 5 * r.stars;
    if (!writing.awarded) state.writeSessions++;
    if (r.xp) r.goalReached = addXp(r.xp);
    writing.awarded = Math.max(writing.awarded, r.stars);
    state.writeStars[writing.focus] = Math.max(state.writeStars[writing.focus] || 0, r.stars);
    bumpStreak();
    r.newBadges = unlockBadges();
    saveState();
    saveWriting();
    saveWriteHistory(r.stars);
    writing.result = r;
    if (view !== "compose") return;
    view = "writeResult";
    render();
    playFanfare(r.stars);
    if (r.stars === 3) confetti();
  }

  function esc(str) {
    return String(str).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function starsText(n, max) {
    return "★ " + n + " / " + max;
  }

  function soundButton() {
    return `<button class="icon-btn" data-action="toggle-sound" aria-label="Ton an/aus">${state.sound ? "🔊" : "🔇"}</button>`;
  }

  function sayButton(text) {
    return `<button class="say" data-action="say" data-text="${esc(text)}" aria-label="Vorlesen">🔊</button>`;
  }

  function playerCard() {
    const { level, into, span, toNext } = levelInfo(state.xp);
    const streak = currentStreak();
    const done = todayXp();
    const goalMet = done >= state.dailyGoal;
    return `
      <section class="player">
        <div class="player-top">
          <span class="lvl">Level ${level}</span>
          <span class="xp">noch ${toNext} XP bis Level ${level + 1}</span>
        </div>
        <div class="bar"><span style="width:${(into / span) * 100}%"></span></div>
        <div class="goal ${goalMet ? "met" : ""}">
          <span>🎯 Tagesziel ${goalMet ? "erreicht!" : ""}</span>
          <span>${done} / ${state.dailyGoal} XP</span>
        </div>
        <div class="bar goal-bar"><span style="width:${Math.min(1, done / state.dailyGoal) * 100}%"></span></div>
        <div class="chips">
          <span class="chip">🔥 ${streak} ${streak === 1 ? "Tag" : "Tage"}</span>
          <span class="chip">📚 ${learnedCount()} / ${VOCAB.length} Wörter</span>
          <span class="chip">⭐ ${totalStars()} Sterne</span>
          <span class="chip">🏅 ${state.badges.length} / ${BADGES.length}</span>
        </div>
      </section>`;
  }

  function badgeTile(b) {
    const got = state.badges.includes(b.id);
    return `
      <div class="badge ${got ? "" : "locked"}">
        <div class="b-ico">${b.icon}</div>
        <div class="b-name">${esc(b.name)}</div>
        <div class="b-desc">${esc(b.desc)}</div>
      </div>`;
  }

  function homeView() {
    const active = MODULES.filter((m) => m.action);
    const upcoming = MODULES.filter((m) => !m.action);
    const moduleDesc = {
      vokabeln: practicingCount() ? `${learnedCount()} / ${VOCAB.length} gelernt · ${practicingCount()} in Arbeit` : `${learnedCount()} / ${VOCAB.length} Wörter gelernt`,
      verben: `${starsText(totalVerbStars(), TENSES.length * MAX_STARS_PER_TENSE)} · ${TENSES.length} Zeitformen`,
      hoeren: `${starsText(totalListenStars(), MAX_LISTEN_STARS)} · Wörter, Sätze, Zahlen`,
      podcast: `${state.podcastsHeard.length} / ${PODCASTS.length} Folgen gehört · ${starsText(totalPodcastStars(), MAX_PODCAST_STARS)}`,
      sprechen: `${starsText(totalSpeakStars(), MAX_SPEAK_STARS)} · Laute, Wörter, Sätze`,
      schreiben: `${starsText(totalWriteStars(), MAX_WRITE_STARS)} · Texte zu Themen`,
    };
    return `
      <header class="hero">
        <div class="logo">🌶️</div>
        <div>
          <h1>Poquito</h1>
          <p>${greeting()}</p>
        </div>
        <div class="spacer"></div>
        ${soundButton()}
      </header>
      ${storageNotice()}
      ${playerCard()}
      ${resumeBanner()}
      <h2 class="section-title">Was möchtest du lernen?</h2>
      <div class="grid two modules">
        ${active.map((m) => `
          <button class="tile big featured" data-action="${m.action}" style="--c:${m.color}">
            <span class="pill go">Los!</span>
            <span class="ico">${m.icon}</span>
            <span class="name">${esc(m.name)}</span>
            <span class="desc">${esc(moduleDesc[m.id])}</span>
          </button>`).join("")}
      </div>
      ${upcoming.length ? `
        <h2 class="section-title">Demnächst</h2>
        <div class="grid two">
          ${upcoming.map((m) => `
            <button class="tile small locked" data-action="locked" aria-disabled="true" style="--c:${m.color}">
              <span class="pill">Bald</span>
              <span class="ico">${m.icon}</span>
              <span class="name">${esc(m.name)}</span>
              <span class="desc">${esc(m.desc)}</span>
            </button>`).join("")}
        </div>` : ""}
      <h2 class="section-title">Abzeichen <small class="count">${state.badges.length} / ${BADGES.length}</small></h2>
      <div class="badges">${[...BADGES].sort((a, b) => state.badges.includes(b.id) - state.badges.includes(a.id)).map(badgeTile).join("")}</div>`;
  }

  function resumeBanner(kinds) {
    const r = loadRound();
    if (!r || (kinds && !kinds.includes(r.kind))) return "";
    return `
      <section class="resume-card">
        <div class="rc-text">
          <b>⏸️ Unterbrochene Runde</b>
          <span>${esc(roundLabel(r))} · ${r.done.length} von ${r.total} geschafft</span>
        </div>
        <div class="rc-btns">
          <button class="btn" data-action="resume">▶ Weiter</button>
          <button class="btn light" data-action="discard-round">Verwerfen</button>
        </div>
      </section>`;
  }

  // Nur wenn es wirklich etwas zu tun gibt: Speichern klappt nicht, oder Safari statt App.
  function storageNotice() {
    if (storageError) return `<div class="notice warn">⚠️ Dein Fortschritt kann gerade nicht gespeichert werden (z. B. im privaten Modus von Safari). Öffne Poquito über das Symbol auf deinem Home-Bildschirm.</div>`;
    if (isAppleMobile() && !isHomeScreenApp()) {
      return `<div class="notice">📱 Tipp: Öffne Poquito über das Symbol auf deinem Home-Bildschirm – dort bleibt dein Fortschritt dauerhaft gespeichert. <button class="link-btn inline" data-action="open-settings">Warum?</button></div>`;
    }
    return "";
  }

  function settingsView() {
    return `
      <header class="hero">
        <div class="logo">⚙️</div>
        <div>
          <h1>Einstellungen</h1>
          <p>Alles wird automatisch gespeichert.</p>
        </div>
        <div class="spacer"></div>
        ${soundButton()}
      </header>
      ${goalPanel()}
      ${voicePanel()}
      ${progressPanel()}
      <section class="panel danger-panel">
        <h3>🗑️ Neu anfangen</h3>
        <p>Löscht deinen Lernfortschritt. Deine Einstellungen und „Meine Wörter“ bleiben erhalten.</p>
        <button class="btn light danger" data-action="reset">Lernfortschritt löschen</button>
      </section>`;
  }

  function goalPanel() {
    return `
      <section class="panel goal-panel">
        <h3>🎯 Tagesziel</h3>
        <p>Eine Runde bringt etwa 15–30 XP. Kleine, regelmäßige Einheiten bringen am meisten.</p>
        <div class="goal-options">
          ${DAILY_GOALS.map((g) => `
            <button class="level-btn ${g.xp === state.dailyGoal ? "on" : ""}" data-action="set-goal" data-goal="${g.xp}">
              <span>${esc(g.name)}</span>
              <small>${g.xp} XP am Tag</small>
            </button>`).join("")}
        </div>
      </section>`;
  }

  function timeText(ms) {
    const d = new Date(ms);
    const time = d.toLocaleTimeString("de-DE", { hour: "2-digit", minute: "2-digit" }) + " Uhr";
    if (dayKey(d) === todayKey()) return "heute, " + time;
    if (dayKey(d) === yesterdayKey()) return "gestern, " + time;
    return d.toLocaleDateString("de-DE") + ", " + time;
  }

  function progressPanel() {
    const inApp = isHomeScreenApp();
    const safari = isAppleMobile() && !inApp;
    const where = inApp ? "in der Poquito-App auf diesem iPad" : safari ? "in Safari" : "in diesem Browser";
    const status = storageError
      ? `<div class="notice warn">⚠️ Dein Fortschritt kann gerade nicht gespeichert werden (z. B. im privaten Modus von Safari). Öffne Poquito normal oder über das Home-Bildschirm-Symbol.</div>`
      : `<p>✅ Nach jeder Antwort automatisch gespeichert – ${where}. Zuletzt: <b>${state.savedAt ? timeText(state.savedAt) : "gerade eben"}</b>.</p>`;
    const split = safari && !storageError ? `
        <div class="notice">📱 Safari und das Poquito-Symbol auf dem Home-Bildschirm haben <b>getrennte Speicher</b>: Was du hier lernst, siehst du in der App nicht – und umgekehrt. Außerdem löscht Safari Daten von Webseiten nach 7 Tagen ohne Besuch. Lerne deshalb am besten immer über das Symbol.</div>` : "";
    const last = state.lastBackup ? timeText(state.lastBackup) : "noch nie";
    return `
      <section class="panel progress-panel">
        <h3>💾 Speichern</h3>
        ${status}
        ${split}
        <details class="more" ${backupOpen ? "open" : ""}>
          <summary data-action="toggle-backup">Sicherung für ein neues iPad (optional)</summary>
          <p>Nur nötig, wenn du das Gerät wechselst oder Stände aus Safari und der App vereinen willst. Beim Laden wird die Sicherung mit deinem Stand zusammengeführt – es geht nichts verloren. Letzte Sicherung: <b>${last}</b>.</p>
          <div class="row-btns">
            <button class="btn light" data-action="export">⬇️ Sicherung speichern</button>
            <button class="btn light" data-action="import">⬆️ Sicherung laden</button>
          </div>
          <input type="file" class="import-file" accept="application/json,.json" hidden>
        </details>
      </section>`;
  }

  function voiceLabel(v) {
    const quality = { premium: " ★ Premium", enhanced: " ★ Erweitert", standard: "" }[voiceQuality(v)];
    return v.name + " (" + voiceLang(v) + ")" + quality;
  }

  function voicePanel() {
    if (!synth) {
      return `
        <section class="panel voice-panel">
          <h3>🗣️ Stimme</h3>
          <p>Dieser Browser kann nicht vorlesen. Öffne Poquito in Safari oder über das Home-Bildschirm-Symbol.</p>
        </section>`;
    }
    const voices = spanishVoices();
    const current = spanishVoice;
    const quality = current ? voiceQuality(current) : null;
    const qualityText = { premium: "Premium – klingt sehr natürlich", enhanced: "Erweitert – klingt natürlich", standard: "Standard – klingt etwas künstlich" }[quality];
    return `
      <section class="panel voice-panel">
        <h3>🗣️ Stimme & Ton</h3>
        ${current
          ? `<p>Poquito spricht mit <b>${esc(current.name)}</b> (${esc(voiceLang(current))}) · ${qualityText}.</p>`
          : `<p>Es wurde noch keine spanische Stimme gefunden.</p>`}
        ${quality !== "premium" ? `
          <div class="notice">✨ <b>Tipp für eine natürlichere Aussprache:</b> Lade kostenlos eine Premium-Stimme. iPad-Einstellungen → Bedienungshilfen → Gesprochene Inhalte → Stimmen → Spanisch → Spanien → z. B. <b>Mónica</b> oder <b>Marisol</b> → Qualität „Premium“ bzw. „Erweitert“ laden. Danach Poquito neu öffnen – die beste Stimme wird automatisch gewählt.</div>` : ""}
        <div class="voice-row">
          <select class="voice-select" aria-label="Stimme wählen">
            <option value="">Automatisch (beste Stimme)</option>
            ${voices.map((v) => `<option value="${esc(v.voiceURI)}" ${v.voiceURI === state.voiceURI ? "selected" : ""}>${esc(voiceLabel(v))}</option>`).join("")}
          </select>
          <button class="btn light" data-action="voice-test">▶ Probe</button>
        </div>
        <div class="setting-row">
          <span>Töne und Vorlesen</span>
          <button class="switch ${state.sound ? "on" : ""}" data-action="toggle-sound-setting" role="switch" aria-checked="${state.sound}" aria-label="Töne und Vorlesen">
            <span></span>
          </button>
        </div>
      </section>`;
  }

  const ACCENT_CHARS = ["á", "é", "í", "ó", "ú", "ñ", "ü", "¿", "¡"];

  function translateView() {
    const [from, to] = trLangs(state.translateDir);
    const r = translator.result;
    return `
      <header class="hero">
        <div class="logo">💬</div>
        <div>
          <h1>Übersetzer</h1>
          <p>Wörter und Sätze – Deutsch ⇄ Spanisch</p>
        </div>
        <div class="spacer"></div>
        ${soundButton()}
      </header>
      <section class="tr-box">
        <div class="tr-dir">
          <span class="tr-chip">${LANG_NAMES[from]}</span>
          <button class="icon-btn tr-swap" data-action="tr-swap" aria-label="Richtung tauschen">⇄</button>
          <span class="tr-chip">${LANG_NAMES[to]}</span>
        </div>
        <textarea class="tr-input" rows="3" maxlength="${MAX_INPUT}" lang="${from}" enterkeyhint="go" autocapitalize="sentences"
          autocorrect="${from === "de" ? "on" : "off"}" spellcheck="${from === "de"}"
          placeholder="${from === "de" ? "Deutsches Wort oder Satz eingeben …" : "Spanisches Wort oder Satz eingeben …"}">${esc(translator.text)}</textarea>
        ${from === "es" ? `<div class="accents">${ACCENT_CHARS.map((a) => `<button class="accent" data-action="accent" data-char="${a}">${a}</button>`).join("")}</div>` : ""}
        <div class="tr-buttons">
          <button class="btn" data-action="tr-go" ${translator.loading ? "disabled" : ""}>${translator.loading ? "Übersetze …" : "Übersetzen"}</button>
          <button class="btn light" data-action="tr-clear">Leeren</button>
        </div>
      </section>
      ${translator.note ? `<div class="notice tr-note">${esc(translator.note)}</div>` : ""}
      ${translator.error ? `<div class="notice warn">${esc(translator.error)}</div>` : ""}
      ${r ? resultCard(r) : ""}
      ${myWordsPanel()}
      ${historyPanel()}
      <p class="tr-credit">Online-Übersetzung: MyMemory (translated.net) – dein Text wird dafür übertragen. Wörter aus dem Poquito-Wörterbuch funktionieren auch ohne Internet.</p>`;
  }

  function wordStatus(es) {
    if (isLearned(es)) return "gelernt ✓";
    if (isPracticing(es)) return "in Arbeit";
    return "noch nicht geübt";
  }

  function resultCard(r) {
    const pair = cardPair(r);
    const saved = WORDS.has(pair.es);
    const tooLong = pair.es.length > MAX_CARD || pair.de.length > MAX_CARD;
    let saveBtn = `<button class="btn light" data-action="tr-save">⭐ Zum Lernen speichern</button>`;
    if (saved) saveBtn = `<button class="btn light" disabled>✓ In deinen Vokabeln</button>`;
    else if (tooLong) saveBtn = "";
    const dictRows = r.dict.map((e) => {
      const where = e.cat ? CATS.get(e.cat).name + " · " + wordStatus(e.es) : "Verb · " + VERB_GROUPS.find((g) => g.id === e.verb.group).name;
      return `
        <div class="tr-info">
          <span>📚 <b lang="es">${esc(e.es)}</b> – ${esc(e.de)} <small>${esc(where)}</small></span>
          ${sayButton(e.es)}
        </div>`;
    }).join("");
    const hintRows = r.hints.map((h) => {
      const link = `<button class="link-btn inline" data-action="open-conj" data-verb="${h.v.inf}" data-tense="${h.tense || "presente"}">Konjugation ansehen</button>`;
      if (!h.tense) {
        const group = VERB_GROUPS.find((g) => g.id === h.v.group).name;
        return `<div class="tr-info"><span>🧩 <b lang="es">${esc(h.v.inf)}</b> ist ein Verb (${esc(h.v.de)}) · ${esc(group)}. ${link}</span></div>`;
      }
      const t = TENSE_BY_ID.get(h.tense);
      return `<div class="tr-info"><span>🧩 Form von <b lang="es">${esc(h.v.inf)}</b> (${esc(h.v.de)}): ${esc(t.name)} – ${esc(h.persons.join(", "))}. ${link}</span></div>`;
    }).join("");
    return `
      <section class="tr-result">
        <div class="tr-label">${LANG_NAMES[r.to]}</div>
        <div class="tr-main" lang="${r.to}">${esc(r.main)}</div>
        <div class="tr-actions">
          <button class="btn sun" data-action="tr-speak">🔊 ${r.to === "es" ? "Anhören" : "Spanisch anhören"}</button>
          <button class="btn light" data-action="tr-copy">📋 Kopieren</button>
          ${saveBtn}
        </div>
        ${r.alts.length ? `
          <div class="tr-alts">
            <span>Auch möglich:</span>
            ${r.alts.map((a, i) => `<button class="tr-alt" data-action="tr-alt" data-i="${i}" lang="${r.to}">${esc(a)}</button>`).join("")}
          </div>` : ""}
        ${dictRows || hintRows ? `<div class="tr-extra">${dictRows}${hintRows}</div>` : ""}
      </section>`;
  }

  function myWordsPanel() {
    const words = [...MY_CAT.words].reverse();
    return `
      <section class="panel my-words">
        <div class="panel-head">
          <h3>⭐ Meine Wörter <small class="count">${words.length}</small></h3>
          ${words.length ? `<button class="btn small" data-action="start" data-source="cat:mine">Lernen</button>` : ""}
        </div>
        ${words.length ? `
          <ul class="mw-list">
            ${words.map((w) => `
              <li>
                <span class="mw-text"><b lang="es">${esc(w.es)}</b><span>${esc(w.de)}</span></span>
                <small>${wordStatus(w.es)}</small>
                ${sayButton(w.es)}
                <button class="mw-del" data-action="mw-del" data-es="${esc(w.es)}" aria-label="Entfernen">✕</button>
              </li>`).join("")}
          </ul>`
        : `<p>Tippe bei einer Übersetzung auf „⭐ Zum Lernen speichern“. Die Wörter landen als Karteikarten unter <b>Vokabeln → Meine Wörter</b>.</p>`}
      </section>`;
  }

  function historyPanel() {
    const list = loadHistory().slice(0, 10);
    if (!list.length) return "";
    return `
      <section class="panel tr-history">
        <div class="panel-head">
          <h3>🕘 Zuletzt übersetzt</h3>
          <button class="link-btn inline" data-action="tr-history-clear">Verlauf löschen</button>
        </div>
        <ul>
          ${list.map((h, i) => `
            <li>
              <button class="tr-hist" data-action="tr-history" data-i="${i}">
                <span>${esc(h.source)}</span>
                <b>${esc(h.main)}</b>
              </button>
            </li>`).join("")}
        </ul>
      </section>`;
  }

  function focusName(focus) {
    return focus === "frei" ? "Freies Thema" : TENSE_BY_ID.get(focus).name;
  }

  function writeView() {
    const history = loadWriteHistory();
    const draft = writing.topic !== null && writing.text.trim() && !writing.awarded ? WRITE_TOPICS[writing.topic] : null;
    const tile = (id, icon, name, desc, color) => `
      <button class="tile" data-action="w-start" data-focus="${id}" style="--c:${color}">
        <span class="ico">${icon}</span>
        <span class="name">${esc(name)}</span>
        <span class="desc">${esc(desc)}</span>
        <span class="stars-line">${starRow(state.writeStars[id] || 0)}</span>
      </button>`;
    return `
      <div class="topbar">
        <button class="icon-btn" data-action="home" aria-label="Zurück">←</button>
        <h2>✍️ Schreiben<small>Freie Texte mit Bewertung</small></h2>
        ${soundButton()}
      </div>
      ${draft ? `
        <section class="resume-card">
          <div class="rc-text">
            <b>✏️ Angefangener Text</b>
            <span>${esc(draft.title)} · ${esc(focusName(writing.focus))} · ${esc(writeCountText(writing.text))}</span>
          </div>
          <div class="rc-btns"><button class="btn" data-action="w-continue">▶ Weiter</button></div>
        </section>` : ""}
      <div class="summary">
        <div class="stat"><b>${state.writeSessions}</b><span>Texte geschrieben</span></div>
        <div class="stat"><b>${totalWriteStars()}</b><span>von ${MAX_WRITE_STARS} Sternen</span></div>
        <div class="stat"><b>${WRITE_SENTENCES.min}–${WRITE_SENTENCES.max}</b><span>Sätze pro Text</span></div>
      </div>
      <p class="lead">Wähle eine Zeitform – Poquito würfelt dir ein passendes Thema. Du schreibst ${WRITE_SENTENCES.min}–${WRITE_SENTENCES.max} Sätze und bekommst eine Bewertung für Rechtschreibung, Grammatik, Zeitform und Ausdruck.</p>
      <h2 class="section-title">Welche Zeitform willst du üben?</h2>
      <div class="grid">
        ${TENSES.map((t) => tile(t.id, t.icon, t.name, t.de, t.color)).join("")}
        ${tile("frei", "🎲", "Freies Thema", "beliebige Zeitformen", "#6C757D")}
      </div>
      ${history.length ? `
        <section class="panel tr-history">
          <div class="panel-head"><h3>📝 Meine Texte</h3></div>
          <ul>
            ${history.slice(0, 10).map((h, i) => `
              <li>
                <button class="tr-hist" data-action="w-history" data-i="${i}">
                  <span>${esc(WRITE_TOPICS[h.topic].title)} · ${esc(focusName(h.focus))} · ${timeText(h.at)} · ${starRow(h.stars)}</span>
                  <b lang="es">${esc(h.text.length > 90 ? h.text.slice(0, 90) + " …" : h.text)}</b>
                </button>
              </li>`).join("")}
          </ul>
        </section>` : ""}`;
  }

  function composeView() {
    const topic = WRITE_TOPICS[writing.topic];
    const tense = TENSE_BY_ID.get(topic.tense);
    return `
      <div class="topbar">
        <button class="icon-btn" data-action="open-write" aria-label="Zurück">←</button>
        <h2>✍️ ${esc(focusName(writing.focus))}<small>${esc(topic.title)}</small></h2>
        ${soundButton()}
      </div>
      <section class="panel write-topic">
        <div class="wt-head">
          <span class="wt-tense" style="--c:${tense.color}">${tense.icon} ${esc(writing.focus === "frei" ? "passt gut zu: " + tense.name : tense.name + " – " + tense.de)}</span>
          <button class="btn light small" data-action="w-shuffle">🔀 Anderes Thema</button>
        </div>
        <h3>${esc(topic.title)}</h3>
        <p>${esc(topic.task)}</p>
        <ul class="wt-ask">${topic.ask.map((q) => `<li>${esc(q)}</li>`).join("")}</ul>
        <div class="wt-starter">
          <span>💡 So könntest du anfangen: <b lang="es">${esc(topic.starter)}</b></span>
          <button class="tr-alt" data-action="w-insert" data-text="${esc(topic.starter.replace(/…$/, ""))}">Übernehmen</button>
        </div>
        <div class="wt-words">
          ${topic.words.map(([es, de]) => `<button class="tr-alt" data-action="w-insert" data-text="${esc(es)}"><b lang="es">${esc(es)}</b> · ${esc(de)}</button>`).join("")}
        </div>
        <button class="link-btn inline" data-action="w-rules" data-tense="${tense.id}">📘 Regeln: ${esc(tense.name)}</button>

  function markedText(text, issues) {
    let html = "";
    let pos = 0;
    [...issues].sort((a, b) => a.offset - b.offset).forEach((i) => {
      if (i.offset < pos) return;
      html += esc(text.slice(pos, i.offset)) + `<mark class="k-${i.kind}">${esc(text.substr(i.offset, i.length))}</mark>`;
      pos = i.offset + i.length;
    });
    return html + esc(text.slice(pos));
  }

  // Kurze Pronomen, damit die Tabellen auch auf dem Handy in die Breite passen.
  const TABLE_PERSONS = ["yo", "tú", "él/ella/Ud.", "nosotros", "vosotros", "ellos/Uds."];
  const TABLE_IMP_PERSONS = ["tú", "Ud.", "nosotros", "vosotros", "Uds."];

  function conjTable(verbs, tense, marked) {
    const persons = tense === "imperativo" ? TABLE_IMP_PERSONS : TABLE_PERSONS;
    const forms = verbs.map((v) => conj(v, tense));
    return `
      <div class="table-scroll">
        <table class="conj">
          <tr><th></th>${verbs.map((v) => `<th>${esc(v.inf)}</th>`).join("")}</tr>
          ${persons.map((p, i) => `
            <tr>
              <td class="pron">${esc(p)}</td>
              ${forms.map((f, j) => `<td>${marked ? markEnding(f[i], verbs[j], tense) : esc(f[i])}</td>`).join("")}
              ${verbs.length === 1 ? `<td>${sayButton(forms[0][i])}</td>` : ""}
            </tr>`).join("")}
        </table>
      </div>`;
  }

  function markEnding(form, v, tense) {
    if (form.includes(" ")) {
      const [aux, rest] = form.split(" ");
      return `<em>${esc(aux)}</em> ${esc(rest)}`;
    }
    const stem = tense === "futuro" || tense === "condicional" ? v.inf : v.inf.slice(0, -2);
    return form.startsWith(stem) ? esc(stem) + `<em>${esc(form.slice(stem.length))}</em>` : esc(form);
  }

          <h3>Signalwörter</h3>

  function drillAnswerArea() {
    const s = session;
    const t = s.task;
    if (s.level === 1) {
      const chars = t.picked.map((i) => t.letters[i]);
      const boxClass = t.result === "right" ? "correct" : t.result === "wrong" ? "wrong" : "";
      return `
        <div class="answer-box ${boxClass}">
          ${chars.length ? chars.map((ch) => (ch === " " ? `<span class="gap"></span>` : `<span>${esc(ch)}</span>`)).join("") : `<span class="placeholder">Tippe die Buchstaben unten</span>`}
        </div>
        ${t.result ? "" : `
          <div class="letters">
            ${t.letters.map((ch, i) => `
              <button class="letter ${ch === " " ? "space" : ""} ${t.picked.includes(i) ? "used" : ""}" data-action="pick" data-i="${i}">${ch === " " ? "␣" : esc(ch)}</button>`).join("")}

          <div class="tools"><button class="btn light" data-action="unpick" ${t.picked.length ? "" : "disabled"}>⌫ Zurück</button></div>`}`;

    const inputClass = t.result === "right" ? "correct" : t.result === "wrong" ? "wrong" : "";

          let cls = "light";
          if (t.result && o === t.answer) cls = "is-right";
          else if (t.result && o === t.given) cls = "picked-wrong";
          return `<button class="btn ${cls}" data-action="option" data-value="${esc(o)}" ${t.result ? "disabled" : ""}>${esc(o)}</button>`;
        }).join("")}
      </div>`;
  }

  function listenAnswerArea() {
    const s = session;
    const t = s.task;
    if (s.level < 3) return optionButtons(t);
    const numbers = s.source === "numbers";
    const inputClass = t.result === "right" ? "correct" : t.result === "wrong" ? "wrong" : "";
    return `
      <input class="type-input ${inputClass}" type="text" value="${esc(t.given)}" ${t.result ? "readonly" : ""}
        ${numbers ? `inputmode="numeric"` : ""} autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
        enterkeyhint="${t.result ? "next" : "done"}" aria-label="Was hast du gehört?">
      ${t.result ? "" : `
        ${numbers ? "" : `<div class="accents">${["á", "é", "í", "ó", "ú", "ñ", "ü"].map((a) => `<button class="accent" data-action="accent" data-char="${a}">${a}</button>`).join("")}</div>`}
        <button class="btn" data-action="check">Prüfen</button>`}`;
  }

  function listenDrillView() {
    const s = session;
    const src = LISTEN_SOURCES.find((x) => x.id === s.source);
    const level = LISTEN_LEVELS[s.level - 1];
    const fresh = s.fresh;
    s.fresh = false;
    return `
      ${sessionTopbar()}
      <div class="stage">
        <div class="prompt listen ${fresh ? "enter" : ""}">
          <span class="cat-chip" style="--c:${src.color}">${src.icon} ${esc(src.name)}</span>

          <button class="slow-btn" data-action="replay-slow">🐢 Langsamer</button>
          <div class="task">${esc(level.hint[s.source])}</div>
        </div>
        ${listenAnswerArea()}
        ${listenFeedback()}
      </div>`;
  }

  function speakView() {
    const lvl = state.speakLevel;
    const mode = speakMode();

      record: `🎙️ Du nimmst dich auf und vergleichst mit dem Original.${Recognition ? ` <button class="link-btn inline" data-action="set-speak-mode" data-mode="auto">Automatisch prüfen lassen</button>` : ""}`,
      self: "Dein Browser kann nicht aufnehmen – sprich laut nach und bewerte dich selbst.",
    }[mode];
    return `
      <div class="topbar">
        <button class="icon-btn" data-action="home" aria-label="Zurück">←</button>
        <h2>🗣️ Sprechen<small>Aussprache üben</small></h2>
        ${soundButton()}
      </div>
      ${resumeBanner(["speak"])}
      <div class="notice">${modeInfo}</div>
      <div class="summary">
        <div class="stat"><b>${totalSpeakStars()}</b><span>von ${MAX_SPEAK_STARS} Sternen</span></div>

      <h2 class="section-title">Schwierigkeit</h2>
      <div class="levels">
        ${SPEAK_LEVELS.map((l) => `
          <button class="level-btn ${l.n === lvl ? "on" : ""}" data-action="set-speak-level" data-level="${l.n}">
            <b>${l.icon}</b>
            <span>${esc(l.name)}</span>
            <small>${esc(l.desc)}</small>
          </button>`).join("")}
      </div>
      <h2 class="section-title">Was möchtest du sprechen?</h2>
      <div class="grid">
        ${SPEAK_SOURCES.map((src) => `
          <button class="tile" data-action="start-speak" data-source="${src.id}" style="--c:${src.color}">
