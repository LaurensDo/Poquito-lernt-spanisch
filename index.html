<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFF4E6">
<title>Poquito – Spanisch lernen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #FFF4E6;
    --surface: #FFFFFF;
    --ink: #2D1E17;
    --muted: #8C7A6B;
    --line: #F1E2D0;
    --primary: #E4572E;
    --primary-dark: #B63F1B;
    --sun: #F6B519;
    --sun-dark: #C98E00;
    --good: #22B573;
    --good-dark: #178556;
    --bad: #E5484D;
    --bad-dark: #B32F34;
    --locked: #CFC3B6;
    --shadow: 0 12px 28px rgba(140, 70, 20, 0.10);
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    font-family: "Nunito", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background:
      radial-gradient(circle at 0% 0%, #FFD9B3 0, transparent 45%),
      radial-gradient(circle at 100% 25%, #FFD6CC 0, transparent 40%),
      radial-gradient(circle at 50% 110%, #FFE7A8 0, transparent 45%),
      var(--bg);
  }

  button, input, select { font: inherit; color: inherit; }

  .app {
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    min-height: 100dvh;
    max-width: 640px;
    margin: 0 auto;
    padding: max(20px, env(safe-area-inset-top)) 16px max(32px, env(safe-area-inset-bottom));
  }

  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    width: 100%;
    max-width: 760px;
    margin: 0 auto;
    padding-bottom: max(24px, 10vh);
  }

  .noscript {
    max-width: 480px;
    margin: 40px auto;
    padding: 20px;
    background: var(--surface);
    border-radius: 20px;
    text-align: center;
    font-weight: 700;
  }

  /* ---------- Kopfbereich ---------- */
  .hero {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 8px 0 20px;
  }

  .logo {
    width: 58px;
    height: 58px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    font-size: 30px;
    background: linear-gradient(135deg, var(--primary), var(--sun));
    box-shadow: 0 6px 0 var(--primary-dark);
    transform: rotate(-6deg);
  }

  .hero h1 {
    margin: 0;
    font-size: 2rem;
    font-weight: 900;
    letter-spacing: -0.02em;
    line-height: 1;
  }

  .hero p {
    margin: 4px 0 0;
    color: var(--muted);
    font-weight: 800;
  }

  .spacer { flex: 1; }

  .icon-btn {
    flex: none;
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 4px 0 var(--line);
    font-size: 1.25rem;
    font-weight: 900;
    display: grid;
    place-items: center;
    cursor: pointer;
  }

  .icon-btn:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--line);
  }

  /* ---------- Spielerkarte (Level, XP, Serie) ---------- */
  .player {
    color: #fff;
    background: linear-gradient(135deg, var(--primary) 0%, #F08A24 60%, var(--sun) 100%);
    border-radius: 24px;
    padding: 18px 20px;
    box-shadow: 0 6px 0 var(--primary-dark), var(--shadow);
    margin-bottom: 28px;
  }

  .player-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }

  .player .lvl { font-size: 1.4rem; font-weight: 900; }
  .player .xp { font-size: 0.9rem; font-weight: 800; opacity: 0.9; }

  .bar {
    height: 12px;
    margin: 10px 0 14px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.3);
    overflow: hidden;
  }

  .bar > span {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: #fff;
    transition: width 0.5s ease;
  }

  .chips { display: flex; flex-wrap: wrap; gap: 8px; }

  .chip {
    padding: 6px 12px;
    border-radius: 99px;
    background: rgba(255, 255, 255, 0.22);
    font-size: 0.9rem;
    font-weight: 800;
  }

  .section-title {
    margin: 0 0 12px;
    font-size: 1.2rem;
    font-weight: 900;
  }

  .lead {
    margin: -8px 0 20px;
    color: var(--muted);
    font-weight: 800;
  }

  /* ---------- Kacheln ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
    margin-bottom: 28px;
  }

  .grid.two { grid-template-columns: repeat(2, 1fr); }
  .grid.three { grid-template-columns: repeat(3, 1fr); }

  @media (min-width: 560px) {
    .grid { grid-template-columns: repeat(3, 1fr); }
  }

  .tile {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 6px;
    padding: 16px;
    border: none;
    border-radius: 20px;
    background: var(--surface);
    box-shadow: 0 5px 0 var(--line), 0 10px 24px rgba(140, 70, 20, 0.06);
    text-align: left;
    cursor: pointer;
    transition: transform 0.1s ease;
  }

  .tile:active:not(.locked) {
    transform: translateY(3px);
    box-shadow: 0 2px 0 var(--line);
  }

  .tile .ico {
    width: 50px;
    height: 50px;
    margin-bottom: 4px;
    border-radius: 15px;
    display: grid;
    place-items: center;
    font-size: 1.6rem;
    background: color-mix(in srgb, var(--c) 20%, white);
  }

  .tile .name { font-size: 1.05rem; font-weight: 900; line-height: 1.2; }
  .tile .desc { font-size: 0.85rem; font-weight: 700; color: var(--muted); }
  .tile .stars-line { font-size: 0.9rem; font-weight: 900; color: var(--sun-dark); }

  .tile.big { padding: 20px; min-height: 180px; }
  .tile.big .ico { width: 64px; height: 64px; font-size: 2.1rem; border-radius: 18px; }
  .tile.big .name { font-size: 1.35rem; }
  .tile.big .desc { font-size: 0.95rem; }

  .tile.featured {
    box-shadow: 0 0 0 3px var(--c), 0 7px 0 3px color-mix(in srgb, var(--c) 70%, black);
  }

  .tile.featured:active {
    box-shadow: 0 0 0 3px var(--c), 0 3px 0 3px color-mix(in srgb, var(--c) 70%, black);
  }

  .tile.small { padding: 14px; }
  .tile.small .ico { width: 42px; height: 42px; font-size: 1.35rem; border-radius: 13px; }

  .tile.locked {
    cursor: default;
    background: rgba(255, 255, 255, 0.5);
    box-shadow: none;
    outline: 2px dashed var(--locked);
    outline-offset: -2px;
  }

  .tile.locked .ico { filter: grayscale(1); opacity: 0.45; }
  .tile.locked .name, .tile.locked .desc { color: #B3A596; }
  .tile.wiggle { animation: wiggle 0.35s ease; }

  .pill {
    position: absolute;
    top: 12px;
    right: 12px;
    padding: 4px 9px;
    border-radius: 99px;
    background: var(--line);
    color: var(--muted);
    font-size: 0.7rem;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  .pill.go { background: var(--c); color: #fff; }
  .pill.err { background: #FDE3E4; color: var(--bad-dark); }

  .medal { position: absolute; top: 10px; right: 12px; font-size: 1.4rem; }

  .mini-bar {
    width: 100%;
    height: 8px;
    margin-top: 4px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
  }

  .mini-bar > span {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: var(--c);
  }

  /* ---------- Buttons ---------- */
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 18px;
    border: none;
    border-radius: 18px;
    background: var(--btn, var(--primary));
    box-shadow: 0 5px 0 var(--btn-dark, var(--primary-dark));
    color: #fff;
    font-size: 1.08rem;
    font-weight: 900;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.08s ease;
  }

  .btn:active:not(:disabled) {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--btn-dark, var(--primary-dark));
  }

  .btn small { font-weight: 800; opacity: 0.85; }

  .btn.good { --btn: var(--good); --btn-dark: var(--good-dark); }
  .btn.bad { --btn: var(--bad); --btn-dark: var(--bad-dark); }
  .btn.sun { --btn: var(--sun); --btn-dark: var(--sun-dark); color: #4A3000; }
  .btn.light { --btn: var(--surface); --btn-dark: var(--line); color: var(--ink); }

  .btn:disabled {
    --btn: var(--locked);
    --btn-dark: #B5A898;
    color: #fff;
    cursor: default;
  }

  .btn-stack { display: grid; gap: 14px; margin-bottom: 28px; }

  .link-btn {
    display: block;
    margin: 8px auto 0;
    border: none;
    background: none;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 800;
    text-decoration: underline;
    cursor: pointer;
  }

  /* ---------- Kopfzeile Unterseiten ---------- */
  .topbar {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 4px 0 20px;
  }

  .topbar h2 {
    flex: 1;
    margin: 0;
    font-size: 1.45rem;
    font-weight: 900;
    line-height: 1.2;
  }

  .topbar h2 small {
    display: block;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 800;
  }

  .progress {
    flex: 1;
    height: 16px;
    border-radius: 99px;
    background: var(--line);
    overflow: hidden;
  }

  .progress > span {
    display: block;
    height: 100%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--good), #6FD99E);
    transition: width 0.4s ease;
  }

  .combo {
    min-width: 52px;
    text-align: right;
    color: var(--primary);
    font-weight: 900;
  }

  /* ---------- Statistik-Kästchen ---------- */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 20px;
  }

  .stat {
    padding: 14px 8px;
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 4px 0 var(--line);
    text-align: center;
  }

  .stat b { display: block; font-size: 1.5rem; font-weight: 900; }
  .stat span { font-size: 0.8rem; font-weight: 800; color: var(--muted); }

  /* ---------- Karteikarte ---------- */
  .scene {
    position: relative;
    height: 320px;
    margin: 8px 0 24px;
    perspective: 1400px;
  }

  .enter { animation: pop-in 0.35s ease-out; }
  .shake { animation: shake 0.45s; }

  .card {
    position: relative;
    width: 100%;
    height: 100%;
    transform-style: preserve-3d;
    transition: transform 0.55s cubic-bezier(0.4, 0.2, 0.2, 1);
    cursor: pointer;
  }

  .card.flipped { transform: rotateY(180deg); }

  .face {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    border-radius: 28px;
    text-align: center;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    transition: box-shadow 0.2s ease;
  }

  .front {
    background: var(--surface);
    box-shadow: 0 8px 0 var(--line), var(--shadow);
  }

  .back {
    background: linear-gradient(160deg, #FFF3CF, #FFE1A6);
    box-shadow: 0 8px 0 #F1CE84, var(--shadow);
    transform: rotateY(180deg);
  }

  .card.correct .face { box-shadow: 0 0 0 5px var(--good), 0 8px 0 5px var(--good-dark); }
  .card.wrong .face { box-shadow: 0 0 0 5px var(--bad), 0 8px 0 5px var(--bad-dark); }

  .cat-chip {
    position: absolute;
    top: 16px;
    left: 16px;
    padding: 6px 11px;
    border-radius: 99px;
    background: color-mix(in srgb, var(--c) 20%, white);
    font-size: 0.8rem;
    font-weight: 900;
  }

  .lang {
    position: absolute;
    top: 20px;
    right: 20px;
    color: var(--muted);
    font-size: 0.72rem;
    font-weight: 900;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }

  .word {
    font-size: clamp(2rem, 7vw, 2.6rem);
    font-weight: 900;
    line-height: 1.15;
    word-break: break-word;
  }

  .sub {
    margin-top: 8px;
    color: #8A6A2E;
    font-size: 1.1rem;
    font-weight: 800;
  }

  .speak {
    width: 58px;
    height: 58px;
    margin-top: 20px;
    border: none;
    border-radius: 50%;
    background: var(--sun);
    box-shadow: 0 4px 0 var(--sun-dark);
    font-size: 1.5rem;
    cursor: pointer;
  }

  .speak:active, .say:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--sun-dark);
  }

  .tap-hint {
    position: absolute;
    bottom: 18px;
    left: 0;
    right: 0;
    color: var(--muted);
    font-size: 0.85rem;
    font-weight: 800;
  }

  .actions {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
    transition: opacity 0.25s ease, transform 0.25s ease;
  }

  .actions.hidden {
    opacity: 0;
    transform: translateY(8px);
    pointer-events: none;
  }

  @media (max-width: 420px) {
    .actions .btn { padding: 16px 6px; font-size: 1rem; }
  }

  .xp-float {
    position: absolute;
    top: 28%;
    left: 50%;
    z-index: 5;
    color: var(--good);
    font-size: 1.7rem;
    font-weight: 900;
    text-shadow: 0 2px 0 #fff;
    pointer-events: none;
    animation: float-up 0.9s ease-out forwards;
  }

  /* ---------- Verben: Stufen & Regeln ---------- */
  .levels {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    margin-bottom: 26px;
  }

  .level-btn {
    padding: 14px 8px;
    border: none;
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 4px 0 var(--line);
    text-align: center;
    cursor: pointer;
  }

  .level-btn:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }
  .level-btn b { display: block; font-size: 1.6rem; }
  .level-btn span { display: block; font-weight: 900; }
  .level-btn small { display: block; color: var(--muted); font-size: 0.78rem; font-weight: 700; }
  .level-btn.on { background: var(--primary); color: #fff; box-shadow: 0 4px 0 var(--primary-dark); }
  .level-btn.on small { color: rgba(255, 255, 255, 0.85); }

  .rules-link {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    margin-bottom: 26px;
    padding: 16px 18px;
    border: none;
    border-radius: 20px;
    background: linear-gradient(135deg, #3A86FF, #7A6CF0);
    box-shadow: 0 5px 0 #2D5FC0;
    color: #fff;
    text-align: left;
    cursor: pointer;
  }

  .rules-link:active { transform: translateY(4px); box-shadow: 0 1px 0 #2D5FC0; }
  .rules-link .ico { font-size: 2rem; }
  .rules-link b { display: block; font-size: 1.15rem; font-weight: 900; }
  .rules-link span { font-weight: 700; opacity: 0.9; font-size: 0.9rem; }

  .panel {
    margin-bottom: 18px;
    padding: 20px;
    border-radius: 22px;
    background: var(--surface);
    box-shadow: 0 5px 0 var(--line);
  }

  .panel h3 { margin: 0 0 12px; font-size: 1.15rem; font-weight: 900; }
  .panel p { margin: 0 0 12px; font-weight: 700; line-height: 1.5; }

  .example {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 0;
    border-top: 1px solid var(--line);
  }

  .example:first-of-type { border-top: none; padding-top: 0; }
  .ex-text { flex: 1; }
  .ex-use { font-size: 0.82rem; font-weight: 900; color: var(--primary); }
  .ex-es { font-size: 1.05rem; font-weight: 900; }
  .ex-de { font-size: 0.9rem; font-weight: 700; color: var(--muted); }

  .say {
    flex: none;
    width: 42px;
    height: 42px;
    border: none;
    border-radius: 50%;
    background: var(--sun);
    box-shadow: 0 3px 0 var(--sun-dark);
    font-size: 1.05rem;
    cursor: pointer;
  }

  .notes { margin: 0; padding-left: 20px; }
  .notes li { margin-bottom: 8px; font-weight: 700; line-height: 1.45; }

  .signal { display: flex; flex-wrap: wrap; gap: 8px; }

  .signal span {
    padding: 6px 12px;
    border-radius: 99px;
    background: var(--bg);
    font-weight: 800;
  }

  .table-scroll { overflow-x: auto; }

  table.conj { width: 100%; border-collapse: collapse; }

  table.conj th {
    padding: 6px 8px;
    text-align: left;
    color: var(--muted);
    font-size: 0.8rem;
    font-weight: 900;
    letter-spacing: 0.04em;
    text-transform: uppercase;
  }

  table.conj td { padding: 9px 8px; border-top: 1px solid var(--line); font-weight: 800; }
  table.conj td.pron { color: var(--muted); font-weight: 700; white-space: nowrap; }
  table.conj em { font-style: normal; color: var(--primary); }
  table.conj td .say { width: 34px; height: 34px; font-size: 0.85rem; }

  .verb-select {
    width: 100%;
    margin-bottom: 12px;
    padding: 12px 14px;
    border: 2px solid var(--line);
    border-radius: 14px;
    background: var(--bg);
    font-weight: 800;
  }

  /* ---------- Verben: Übung ---------- */
  .prompt {
    position: relative;
    margin-bottom: 20px;
    padding: 58px 20px 24px;
    border-radius: 28px;
    background: var(--surface);
    box-shadow: 0 8px 0 var(--line), var(--shadow);
    text-align: center;
  }

  .prompt .pron { font-size: clamp(1.9rem, 6vw, 2.6rem); font-weight: 900; line-height: 1.15; }

  .prompt .inf {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    margin-top: 10px;
    font-size: 1.25rem;
    font-weight: 900;
  }

  .prompt .inf small { color: var(--muted); font-weight: 800; }
  .prompt .task { margin-top: 12px; color: var(--muted); font-size: 0.9rem; font-weight: 800; }

  .answer-box {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: center;
    min-height: 68px;
    margin-bottom: 16px;
    padding: 10px 14px;
    border: 3px dashed var(--locked);
    border-radius: 18px;
    background: var(--surface);
    font-size: 1.9rem;
    font-weight: 900;
  }

  .answer-box .gap { width: 16px; }
  .answer-box .placeholder { color: var(--muted); font-size: 1rem; font-weight: 800; }
  .answer-box.correct, .type-input.correct { border: 3px solid var(--good); background: #E6F8EF; }
  .answer-box.wrong, .type-input.wrong { border: 3px solid var(--bad); background: #FDECEC; }

  .letters {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 10px;
    margin-bottom: 16px;
  }

  .letter {
    width: 54px;
    height: 58px;
    border: none;
    border-radius: 14px;
    background: var(--surface);
    box-shadow: 0 5px 0 var(--line);
    font-size: 1.6rem;
    font-weight: 900;
    cursor: pointer;
  }

  .letter:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--line); }
  .letter.space { width: 84px; color: var(--muted); }
  .letter.used { visibility: hidden; }

  .tools { display: flex; justify-content: center; }
  .tools .btn { width: auto; padding: 12px 22px; }

  .options { display: grid; gap: 12px; }
  .options .btn { font-size: 1.45rem; padding: 18px; }
  .options .btn.picked-wrong { --btn: var(--bad); --btn-dark: var(--bad-dark); color: #fff; }
  .options .btn.is-right { --btn: var(--good); --btn-dark: var(--good-dark); color: #fff; }

  .type-input {
    width: 100%;
    margin-bottom: 12px;
    padding: 14px;
    border: 3px solid var(--line);
    border-radius: 18px;
    outline: none;
    background: var(--surface);
    font-size: 1.7rem;
    font-weight: 900;
    text-align: center;
  }

  .type-input:focus { border-color: var(--sun); }

  .accents {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    margin-bottom: 14px;
  }

  .accent {
    width: 48px;
    height: 48px;
    border: none;
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 0 4px 0 var(--line);
    font-size: 1.35rem;
    font-weight: 900;
    cursor: pointer;
  }

  .accent:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--line); }

  @media (max-width: 420px) {
    .accents { gap: 6px; }
    .accent { width: 42px; height: 46px; }
  }

  .feedback {
    margin-top: 16px;
    padding: 14px 16px;
    border-radius: 18px;
    text-align: center;
    font-weight: 900;
    animation: pop-in 0.25s ease-out;
  }

  .feedback.good { background: #E6F8EF; color: var(--good-dark); }
  .feedback.bad { background: #FDECEC; color: var(--bad-dark); }
  .fb-answer { display: block; margin-top: 4px; color: var(--ink); font-size: 1.6rem; }
  .feedback .btn { margin-top: 12px; }

  /* ---------- Hören ---------- */
  .prompt.listen { padding-top: 64px; }

  .play-btn {
    width: 120px;
    height: 120px;
    border: none;
    border-radius: 50%;
    background: var(--sun);
    box-shadow: 0 7px 0 var(--sun-dark);
    font-size: 3.2rem;
    cursor: pointer;
  }

  .play-btn:active { transform: translateY(5px); box-shadow: 0 2px 0 var(--sun-dark); }
  .speaking .play-btn { animation: pulse 0.9s ease-in-out infinite; }

  .slow-btn {
    display: block;
    margin: 18px auto 0;
    padding: 8px 18px;
    border: none;
    border-radius: 99px;
    background: var(--bg);
    box-shadow: 0 3px 0 var(--line);
    font-weight: 900;
    cursor: pointer;
  }

  .slow-btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--line); }
  .fb-sub { display: block; margin-top: 2px; color: var(--muted); font-size: 1rem; font-weight: 800; }
  .options.long .btn { font-size: 1.1rem; padding: 16px; }

  .notice {
    margin-bottom: 20px;
    padding: 12px 16px;
    border-radius: 16px;
    background: #FFF1CC;
    color: #6B4E00;
    font-weight: 800;
  }

  .grid.modules > :last-child:nth-child(odd) { grid-column: 1 / -1; }

  /* ---------- Ergebnis ---------- */
  .result {
    margin-bottom: 22px;
    padding: 28px 20px;
    border-radius: 28px;
    background: var(--surface);
    box-shadow: 0 8px 0 var(--line), var(--shadow);
    text-align: center;
    animation: pop-in 0.4s ease-out;
  }

  .stars { font-size: 3.4rem; letter-spacing: 6px; line-height: 1.1; }
  .stars span { display: inline-block; color: var(--line); }

  .stars span.on {
    color: var(--sun);
    text-shadow: 0 4px 0 var(--sun-dark);
    animation: star-pop 0.5s both;
  }

  .stars span.on:nth-child(2) { animation-delay: 0.2s; }
  .stars span.on:nth-child(3) { animation-delay: 0.4s; }

  .result h2 { margin: 8px 0 4px; font-size: 2rem; font-weight: 900; }
  .result p { margin: 0 0 20px; color: var(--muted); font-weight: 800; }
  .result .summary { margin-bottom: 16px; }
  .result .stat { background: var(--bg); box-shadow: none; }

  .levelup {
    margin-bottom: 14px;
    padding: 12px;
    border-radius: 16px;
    background: linear-gradient(135deg, var(--primary), var(--sun));
    color: #fff;
    font-weight: 900;
  }

  .new-badges h3 { margin: 8px 0 10px; font-size: 1.05rem; font-weight: 900; }
  .new-badges .badges { grid-template-columns: repeat(auto-fit, minmax(110px, 150px)); justify-content: center; }

  /* ---------- Abzeichen ---------- */
  .badges {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
    gap: 10px;
  }

  .badge {
    padding: 12px 8px;
    border-radius: 18px;
    background: var(--surface);
    box-shadow: 0 4px 0 var(--line);
    text-align: center;
  }

  .b-ico { font-size: 2rem; }
  .b-name { margin-top: 4px; font-size: 0.85rem; font-weight: 900; }
  .b-desc { margin-top: 2px; color: var(--muted); font-size: 0.72rem; font-weight: 700; }

  .badge.locked { background: rgba(255, 255, 255, 0.5); box-shadow: none; }
  .badge.locked .b-ico { filter: grayscale(1); opacity: 0.35; }
  .badge.locked .b-name { color: var(--muted); }

  /* ---------- Konfetti ---------- */
  .confetti {
    position: fixed;
    inset: 0;
    z-index: 50;
    overflow: hidden;
    pointer-events: none;
  }

  .confetti i {
    position: absolute;
    top: -16px;
    width: 9px;
    height: 15px;
    border-radius: 2px;
    animation: fall linear forwards;
  }

  /* ---------- Große Tablets (z. B. iPad Pro 12,9") ---------- */
  @media (min-width: 900px) {
    html { font-size: 18px; }
    .app { max-width: 1000px; padding-left: 36px; padding-right: 36px; }
    .grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
    .grid.two { grid-template-columns: repeat(2, 1fr); }
    .grid.three, .grid.modules { grid-template-columns: repeat(3, 1fr); }
    .grid.modules > :last-child:nth-child(odd) { grid-column: auto; }
    .btn-stack.pair { grid-template-columns: 1fr 1fr; }
    .play-btn { width: 140px; height: 140px; font-size: 3.8rem; }
    .logo { width: 68px; height: 68px; font-size: 36px; }
    .icon-btn { width: 54px; height: 54px; }
    .tile.big { min-height: 210px; padding: 24px; }
    .scene { height: clamp(360px, 40vh, 480px); }
    .speak { width: 68px; height: 68px; font-size: 1.8rem; }
    .letter { width: 64px; height: 70px; font-size: 1.9rem; }
    .accent { width: 58px; height: 58px; }
    .badges { grid-template-columns: repeat(7, 1fr); }
  }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.08); }
  }

  @keyframes fall { to { transform: translateY(110vh) rotate(720deg); } }

  @keyframes pop-in {
    from { opacity: 0; transform: translateY(14px) scale(0.96); }
    to { opacity: 1; transform: none; }
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    20% { transform: translateX(-10px); }
    40% { transform: translateX(10px); }
    60% { transform: translateX(-6px); }
    80% { transform: translateX(6px); }
  }

  @keyframes wiggle {
    0%, 100% { transform: rotate(0); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }

  @keyframes float-up {
    0% { opacity: 0; transform: translate(-50%, 10px) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, 0) scale(1.1); }
    100% { opacity: 0; transform: translate(-50%, -60px) scale(1); }
  }

  @keyframes star-pop {
    0% { transform: scale(0) rotate(-30deg); }
    70% { transform: scale(1.3) rotate(8deg); }
    100% { transform: scale(1) rotate(0); }
  }
</style>

  // ---------- Konjugation ----------
  const END = {
    presente: { ar: ["o", "as", "a", "amos", "áis", "an"], er: ["o", "es", "e", "emos", "éis", "en"], ir: ["o", "es", "e", "imos", "ís", "en"] },
    indefinido: { ar: ["é", "aste", "ó", "amos", "asteis", "aron"], er: ["í", "iste", "ió", "imos", "isteis", "ieron"], ir: ["í", "iste", "ió", "imos", "isteis", "ieron"] },
    imperfecto: { ar: ["aba", "abas", "aba", "ábamos", "abais", "aban"], er: ["ía", "ías", "ía", "íamos", "íais", "ían"], ir: ["ía", "ías", "ía", "íamos", "íais", "ían"] },
    subjuntivo: { ar: ["e", "es", "e", "emos", "éis", "en"], er: ["a", "as", "a", "amos", "áis", "an"], ir: ["a", "as", "a", "amos", "áis", "an"] },
  };
  const FUT_END = ["é", "ás", "á", "emos", "éis", "án"];
  const COND_END = ["ía", "ías", "ía", "íamos", "íais", "ían"];
  const HABER_PRES = ["he", "has", "ha", "hemos", "habéis", "han"];
  const HABER_IMPF = ["había", "habías", "había", "habíamos", "habíais", "habían"];
  const BOOT = [0, 1, 2, 5];

  function changeStem(stem, change) {
    const [from, to] = change.split(">");
    const i = stem.lastIndexOf(from);
    return stem.slice(0, i) + to + stem.slice(i + from.length);
  }

  // -ir-Verben mit Stammwechsel: e → i bzw. o → u in der 3. Person Indefinido und im Subjuntivo (nosotros/vosotros)
  function weakChange(change) {
    return change === "o>ue" ? "o>u" : "e>i";
  }

  // -car/-gar/-zar: vor e ändert sich die Schreibung, damit der Laut gleich bleibt
  function spell(stem, inf, ending) {
    if (!/^[eé]/.test(ending)) return stem;
    if (inf.endsWith("car")) return stem.slice(0, -1) + "qu";
    if (inf.endsWith("gar")) return stem + "u";
    if (inf.endsWith("zar")) return stem.slice(0, -1) + "c";
    return stem;
  }

  function participio(v) {
    return v.part || v.inf.slice(0, -2) + (v.inf.endsWith("ar") ? "ado" : "ido");
  }

  function conj(v, tense) {
    if (v.forms && v.forms[tense]) return v.forms[tense];
    const t = v.inf.slice(-2);
    const s = v.inf.slice(0, -2);
    switch (tense) {
      case "presente":
        return END.presente[t].map((e, i) => {
          if (i === 0 && v.yo) return v.yo;
          return (v.stem && BOOT.includes(i) ? changeStem(s, v.stem) : s) + e;
        });
      case "indefinido":
        return END.indefinido[t].map((e, i) => {
          const st = t === "ir" && v.stem && (i === 2 || i === 5) ? changeStem(s, weakChange(v.stem)) : s;
          return spell(st, v.inf, e) + e;
        });
      case "imperfecto":
        return END.imperfecto[t].map((e) => s + e);
      case "futuro":
        return FUT_END.map((e) => (v.futStem || v.inf) + e);
      case "condicional":
        return COND_END.map((e) => (v.futStem || v.inf) + e);
      case "perfecto":
        return HABER_PRES.map((h) => h + " " + participio(v));
      case "pluscuamperfecto":
        return HABER_IMPF.map((h) => h + " " + participio(v));
      case "subjuntivo": {
        if (v.subjFromYo) {
          const yoStem = conj(v, "presente")[0].slice(0, -1);
          return END.subjuntivo[t].map((e) => yoStem + e);
        }
        return END.subjuntivo[t].map((e, i) => {
          let st = s;
          if (v.stem && BOOT.includes(i)) st = changeStem(s, v.stem);
          else if (v.stem && t === "ir") st = changeStem(s, weakChange(v.stem));
          return spell(st, v.inf, e) + e;
        });
      }
      case "subjImperfecto": {
        const base = conj(v, "indefinido")[5].slice(0, -3);
        const accented = base.slice(0, -1) + (base.endsWith("a") ? "á" : "é");
        return ["ra", "ras", "ra", "ramos", "rais", "ran"].map((e, i) => (i === 3 ? accented : base) + e);
      }
      case "imperativo": {
        const pres = conj(v, "presente");
        const subj = conj(v, "subjuntivo");
        return [v.impTu || pres[2], subj[2], v.impNos || subj[3], v.inf.slice(0, -1) + "d", subj[5]];
      }
    }
    return [];
  }

  function personsFor(tense) {
    return tense === "imperativo" ? IMP_PERSONS : PERSONS;
  }

  // Typischer Anfängerfehler: das Verb so konjugieren, als wäre es regelmäßig.
  function regularizedForm(v, tense, person) {
    if (v.inf.length < 4) return null;
    return conj({ inf: v.inf }, tense)[person];
  }

  const RELATED_TENSE = {
    presente: "subjuntivo", subjuntivo: "presente",
    indefinido: "imperfecto", imperfecto: "indefinido",
    perfecto: "pluscuamperfecto", pluscuamperfecto: "perfecto",
    futuro: "condicional", condicional: "futuro",
    subjImperfecto: "imperfecto", imperativo: "subjuntivo",
  };

  function distractors(task) {
    const v = task.verb;
    const pool = [];
    const reg = regularizedForm(v, task.tense, task.person);
    if (reg) pool.push(reg);
    const rel = RELATED_TENSE[task.tense];
    const relPerson = task.tense === "imperativo" ? task.person + 1 : task.person;
    pool.push(conj(v, rel)[relPerson]);
    shuffle(conj(v, task.tense).slice()).forEach((f) => pool.push(f));
    const unique = [];
    pool.forEach((f) => {
      if (f && f !== task.answer && !unique.includes(f)) unique.push(f);
    });
    return unique.slice(0, 2);
  }

  // ---------- Vokabel-Runden ----------
  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function parseSource(str) {
    if (str.startsWith("cat:")) return { type: "cat", id: str.slice(4) };
    return { type: str };
  }

  // Mischt Wiederholungen (Fehler zuerst) mit neuen Wörtern; gelernte Wörter füllen nur auf.
  function pickCards(source) {
    if (source.type === "mistakes") return shuffle([...state.wrongStack]).slice(0, SESSION_SIZE);

    const pool = source.type === "cat" ? CATS.get(source.id).words.map((w) => w.es) : VOCAB.map((w) => w.es);
    const wrong = new Set(state.wrongStack);
    const level = (id) => (state.progress[id] ? state.progress[id].level : 0);
    const lastSeen = (id) => (state.progress[id] && state.progress[id].lastSeen) || 0;

    const review = pool
      .filter((id) => isSeen(id) && !isLearned(id))
      .sort((a, b) => wrong.has(b) - wrong.has(a) || level(a) - level(b) || lastSeen(a) - lastSeen(b));
    const fresh = shuffle(pool.filter((id) => !isSeen(id)));
    const known = pool
      .filter((id) => isLearned(id))
      .sort((a, b) => level(a) - level(b) || lastSeen(a) - lastSeen(b));

    const half = Math.ceil(SESSION_SIZE / 2);
    const picked = new Set(review.slice(0, half));
    for (const id of [...fresh, ...review, ...known]) {
      if (picked.size >= SESSION_SIZE) break;
      picked.add(id);
    }
    return shuffle([...picked]);
  }

  function newSession(kind, fields) {
    busy = false;
    session = Object.assign({
      kind,
      firstTry: new Map(),
      done: new Set(),
      xp: 0,
      combo: 0,
      bestCombo: 0,
      startXp: state.xp,
      firstRight: 0,
      stars: 0,
      newBadges: [],
    }, fields);
  }

  function startVocab(source) {
    const cards = pickCards(source);
    if (cards.length === 0) return;
    newSession("vocab", { source, queue: cards, total: cards.length, current: null });
    view = "session";
    nextCard();
  }

  function nextCard() {
    if (session.queue.length === 0) {
      finishSession();
      return;
    }
    session.current = session.queue.shift();
    render();
    speak(session.current);
  }

  // Nur die erste Antwort pro Runde zählt für Level und Fehlerstapel;
  // falsche Karten kommen in der Runde nochmal, bis sie sitzen.
  function answerCard(knewIt) {
    if (busy || !session) return;
    busy = true;
    const s = session;
    const id = s.current;
    const firstAnswer = !s.firstTry.has(id);

    if (firstAnswer) {
      s.firstTry.set(id, knewIt);
      const p = prog(id);
      p.lastSeen = Date.now();
      if (knewIt) {
        p.correct++;
        p.level = Math.min(MAX_LEVEL, p.level + 1);
        removeFromWrongStack(id);
      } else {
        p.wrong++;
        p.level = 0;
        if (!state.wrongStack.includes(id)) state.wrongStack.push(id);
      }
    }

    const scene = app.querySelector(".scene");
    const card = app.querySelector(".card");

    if (knewIt) {
      const gain = firstAnswer ? XP_FIRST_TRY : XP_RETRY;
      reward(s, id, gain);
      card.classList.add("correct");
      floatText(scene, "+" + gain + " XP");
      playCorrect();
    } else {
      s.combo = 0;
      s.queue.splice(Math.min(3, s.queue.length), 0, id);
      card.classList.add("wrong");
      restartAnimation(scene, "shake");
      playWrong();
    }

    saveState();
    updateSessionBar();
    setTimeout(() => {
      if (session !== s) return;
      busy = false;
      nextCard();
    }, 750);
  }

  function reward(s, id, gain) {
    s.xp += gain;
    state.xp += gain;
    s.combo++;
    s.bestCombo = Math.max(s.bestCombo, s.combo);
    s.done.add(id);
  }

  // ---------- Verb-Runden ----------
  function verbsFor(group, tense) {
    let list = group === "mixed" ? VERBS : VERBS.filter((v) => v.group === group);
    if (tense === "imperativo") list = list.filter((v) => !v.noImp);
    return list;
  }

  function buildTasks(tense, group) {
    const verbs = shuffle(verbsFor(group, tense).slice());
    const personCount = personsFor(tense).length;
    const tasks = [];
    const used = new Set();
    for (let i = 0; tasks.length < SESSION_SIZE && i < SESSION_SIZE * 4; i++) {
      const v = verbs[i % verbs.length];
      const p = Math.floor(Math.random() * personCount);
      const id = v.inf + "|" + p;
      if (used.has(id)) continue;
      used.add(id);
      tasks.push({ id, verb: v, person: p, tense, answer: conj(v, tense)[p] });
    }
    return tasks;
  }

  function prepareTask(base, level) {
    const task = Object.assign({}, base, { base, result: null, accentOnly: false, given: "" });
    if (level === 1) {
      const chars = [...task.answer];
      let order = shuffle(chars.map((_, i) => i));
      for (let tries = 0; tries < 5 && chars.length > 1 && order.every((n, i) => chars[n] === chars[i]); tries++) {
        order = shuffle(order);
      }
      task.letters = order.map((n) => chars[n]);
      task.picked = [];
    } else if (level === 2) {
      task.options = shuffle([task.answer, ...distractors(task)]);
    }
    return task;
  }

  function startDrill(tense, group) {
    const level = state.verbLevel;
    const tasks = buildTasks(tense, group);
    newSession("verbs", { tense, group, level, queue: tasks, total: tasks.length, task: null });
    view = "drill";
    nextTask();
  }

  function nextTask() {
    const s = session;
    if (s.queue.length === 0) {
      finishSession();
      return;
    }
    const base = s.queue.shift();
    s.task = s.kind === "listen" ? prepareListenTask(base, s.source, s.level) : prepareTask(base, s.level);
    s.fresh = true;
    render();
    if (s.kind === "listen") speak(s.task.audio);
    focusInput();
  }

  function normalize(str) {
    return str.normalize("NFC").trim().toLowerCase().replace(/\s+/g, " ");
  }

  // Beim Diktat zählen Satzzeichen und Groß-/Kleinschreibung nicht.
  function normalizeListen(str) {
    return normalize(str.replace(/[¿?¡!.,;:"'«»()]/g, " "));
  }

  function checkAnswer(s, t, given) {
    if (s.kind === "listen" && s.source === "numbers") {
      return { ok: given.replace(/\D/g, "") === t.answer, accentOnly: false };
    }
    const norm = s.kind === "listen" ? normalizeListen : normalize;
    const a = norm(given);
    const b = norm(t.answer);
    return { ok: a === b, accentOnly: a !== b && stripAccents(a) === stripAccents(b) };
  }

  function stripAccents(str) {
    return str.normalize("NFD").replace(/[̀-ͯ]/g, "");
  }

  function submitDrill(given) {
    const s = session;
    const t = s.task;
    if (!t || t.result) return;
    const { ok, accentOnly } = checkAnswer(s, t, given);
    t.given = given;
    t.result = ok ? "right" : "wrong";
    t.accentOnly = accentOnly;
    const first = !s.firstTry.has(t.id);
    if (first) s.firstTry.set(t.id, ok);
    const spoken = s.kind === "listen" ? t.audio : t.answer;

    if (ok) {
      reward(s, t.id, first ? XP_FIRST_TRY : XP_RETRY);
      playCorrect();
      if (s.kind !== "listen") speak(spoken);
    } else {
      s.combo = 0;
      s.queue.splice(Math.min(3, s.queue.length), 0, t.base);
      playWrong();
      setTimeout(() => {
        if (session === s && s.task === t) speak(spoken);
      }, 450);
    }
    saveState();
    render();
    if (ok && s.level !== 3) {
      const delay = s.kind !== "listen" ? 1100 : s.source === "sentences" ? 2400 : 1600;
      setTimeout(() => {
        if (session === s && s.task === t) nextTask();
      }, delay);
    } else {
      focusInput();
    }
  }

  function focusInput() {
    const input = app.querySelector(".type-input");
    if (input) input.focus();
  }

  function finishSession() {
    const s = session;
    s.firstRight = [...s.firstTry.values()].filter(Boolean).length;
    const ratio = s.firstRight / s.total;
    s.stars = ratio === 1 ? 3 : ratio >= 0.6 ? 2 : 1;
    if (ratio === 1) {
      s.xp += XP_PERFECT_BONUS;
      state.xp += XP_PERFECT_BONUS;
      state.perfectSessions++;
    }
    if (s.kind === "verbs") {
      const key = s.tense + "|" + s.group + "|" + s.level;
      state.verbStars[key] = Math.max(state.verbStars[key] || 0, s.stars);
      state.verbSessions++;
      if (!state.verbTensesDone.includes(s.tense)) state.verbTensesDone.push(s.tense);
    } else if (s.kind === "listen") {
      const key = s.source + "|" + s.level;
      state.listenStars[key] = Math.max(state.listenStars[key] || 0, s.stars);
      state.listenSessions++;
    } else {
      state.sessionsDone++;
    }
    bumpStreak();
    s.newBadges = unlockBadges();
    saveState();
    view = "result";
    render();
    playFanfare(s.stars);
    if (s.stars === 3) confetti();
  }

  // ---------- Hör-Runden ----------
  function numberWord(n) {
    if (n < 30) return NUMBER_WORDS[n];
    if (n === 100) return "cien";
    const unit = n % 10;
    return TENS_WORDS[Math.floor(n / 10)] + (unit ? " y " + NUMBER_WORDS[unit] : "");
  }

  // Zahlen, die man beim Hören leicht verwechselt: 45/54, 16/60, 6/16 …
  function nearNumbers(n) {
    const tens = Math.floor(n / 10);
    const unit = n % 10;
    const strong = [];
    if (n >= 10 && n < 100 && unit !== tens) strong.push(unit * 10 + tens);
    if (n >= 13 && n <= 19) strong.push((n - 10) * 10);
    if (n >= 30 && n < 100 && unit === 0) strong.push(10 + tens);
    if (n >= 3 && n <= 9) strong.push(10 + n, n * 10);
    const weak = [n + 1, n - 1, n + 10, n - 10];
    const result = [];
    [...shuffle(strong), ...shuffle(weak)].forEach((m) => {
      if (m >= 0 && m <= 100 && m !== n && !result.includes(m)) result.push(m);
    });
    return result.slice(0, 2);
  }

  function farNumbers(n) {
    const result = [];
    while (result.length < 2) {
      const m = Math.floor(Math.random() * 101);
      if (Math.abs(m - n) >= 8 && result.every((r) => Math.abs(r - m) >= 8)) result.push(m);
    }
    return result;
  }

  function levenshtein(a, b) {
    const row = Array.from({ length: b.length + 1 }, (_, i) => i);
    for (let i = 1; i <= a.length; i++) {
      let prev = row[0];
      row[0] = i;
      for (let j = 1; j <= b.length; j++) {
        const tmp = row[j];
        row[j] = Math.min(row[j] + 1, row[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
        prev = tmp;
      }
    }
    return row[b.length];
  }

  // Zwei ähnlich klingende Alternativen: die nächsten Nachbarn nach Schreibweise, etwas zufällig gemischt.
  function similarTo(target, pool) {
    const plainTarget = stripAccents(normalizeListen(target));
    const scored = [];
    pool.forEach((x) => {
      const plainX = stripAccents(normalizeListen(x));
      if (plainX !== plainTarget && !scored.some((s) => s.plain === plainX)) {
        scored.push({ x, plain: plainX, d: levenshtein(plainTarget, plainX) });
      }
    });
    scored.sort((a, b) => a.d - b.d);
    return shuffle(scored.slice(0, 5)).slice(0, 2).map((s) => s.x);
  }

  function meaningDistractors(base, source) {
    const pool = source === "sentences"
      ? shuffle(SENTENCES.map((s) => s.de))
      : [...shuffle(CATS.get(base.cat).words.map((w) => w.de)), ...shuffle(VOCAB.map((w) => w.de))];
    const result = [];
    pool.forEach((d) => {
      if (result.length < 2 && d !== base.de && !result.includes(d)) result.push(d);
    });
    return result;
  }

  // Wörter: bevorzugt schon gesehene Vokabeln, der Rest wird mit neuen aufgefüllt.
  function buildListenTasks(source) {
    if (source === "numbers") {
      return shuffle([...Array(101).keys()]).slice(0, SESSION_SIZE)
        .map((n) => ({ id: "n" + n, audio: numberWord(n), es: numberWord(n), de: String(n), num: n }));
    }
    if (source === "sentences") {
      return shuffle(SENTENCES.slice()).slice(0, SESSION_SIZE)
        .map((s) => ({ id: s.es, audio: s.es, es: s.es, de: s.de }));
    }
    const seen = shuffle(VOCAB.filter((w) => isSeen(w.es)));
    const unseen = shuffle(VOCAB.filter((w) => !isSeen(w.es)));
    return shuffle([...seen.slice(0, 6), ...unseen, ...seen.slice(6)].slice(0, SESSION_SIZE))
      .map((w) => ({ id: w.es, audio: w.es, es: w.es, de: w.de, cat: w.cat }));
  }

  function prepareListenTask(base, source, level) {
    const task = Object.assign({}, base, { base, result: null, accentOnly: false, given: "" });
    if (source === "numbers") {
      task.answer = base.de;
      if (level < 3) task.options = shuffle([base.num, ...(level === 1 ? farNumbers(base.num) : nearNumbers(base.num))].map(String));
      return task;
    }
    if (level === 1) {
      task.answer = base.de;
      task.options = shuffle([base.de, ...meaningDistractors(base, source)]);
      return task;
    }
    task.answer = base.es;
    if (level === 2) {
      const pool = source === "sentences" ? SENTENCES.map((s) => s.es) : VOCAB.map((w) => w.es);
      task.options = shuffle([base.es, ...similarTo(base.es, pool)]);
    }
    return task;
  }

  function startListen(source) {
    if (!synth) return;
    if (!state.sound) {
      state.sound = true;
      saveState();
    }
    const level = state.listenLevel;
    const tasks = buildListenTasks(source);
    newSession("listen", { source, level, queue: tasks, total: tasks.length, task: null });
    view = "drill";
    nextTask();
  }

  // ---------- Ton & Sprache ----------
  let audioCtx = null;

  function unlockAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
  }

  function tone(freq, start, dur, type, vol, slideTo) {
    if (!audioCtx || !state.sound) return;
    const t0 = audioCtx.currentTime + start;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(vol, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function swish() {
    if (!audioCtx || !state.sound) return;
    const t0 = audioCtx.currentTime;
    const len = Math.floor(audioCtx.sampleRate * 0.22);
    const buffer = audioCtx.createBuffer(1, len, audioCtx.sampleRate);
    const data = buffer.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = Math.random() * 2 - 1;
    const src = audioCtx.createBufferSource();
    src.buffer = buffer;
    const filter = audioCtx.createBiquadFilter();
    filter.type = "bandpass";
    filter.Q.value = 1.4;
    filter.frequency.setValueAtTime(700, t0);
    filter.frequency.exponentialRampToValueAtTime(3200, t0 + 0.2);
    const gain = audioCtx.createGain();
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(0.22, t0 + 0.05);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.22);
    src.connect(filter).connect(gain).connect(audioCtx.destination);
    src.start(t0);
  }

  const sfx = {
    tap: () => tone(520, 0, 0.07, "sine", 0.14, 820),
    back: () => tone(760, 0, 0.08, "sine", 0.13, 460),
    locked: () => tone(170, 0, 0.16, "triangle", 0.28, 110),
    flip: () => swish(),
    select: (n) => tone(620 + n * 40, 0, 0.08, "sine", 0.15),
    remove: () => tone(440, 0, 0.08, "sine", 0.13, 300),
  };

  function playCorrect() {
    tone(784, 0, 0.18, "triangle", 0.3);
    tone(1175, 0.1, 0.4, "triangle", 0.3);
  }

  function playWrong() {
    tone(311, 0, 0.22, "square", 0.08, 277);
    tone(233, 0.2, 0.45, "square", 0.08, 165);
  }

  function playFanfare(stars) {
    [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.12, 0.3, "triangle", 0.25));
    if (stars === 3) tone(1319, 0.5, 0.7, "triangle", 0.22);
  }

  const synth = "speechSynthesis" in window ? window.speechSynthesis : null;
  let spanishVoice = null;

  function pickVoice() {
    const voices = synth.getVoices();
    spanishVoice =
      voices.find((v) => v.lang === "es-ES") ||
      voices.find((v) => v.lang.toLowerCase().startsWith("es")) ||
      null;
  }

  if (synth) {
    pickVoice();
    synth.onvoiceschanged = pickVoice;
  }

  function speak(text, rate) {
    if (!synth || !state.sound) return;
    synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "es-ES";
    if (spanishVoice) u.voice = spanishVoice;
    u.rate = rate || 0.9;
    u.onstart = () => document.body.classList.add("speaking");
    u.onend = u.onerror = () => document.body.classList.remove("speaking");
    synth.speak(u);
  }

  // ---------- Effekte ----------
  function floatText(parent, text) {
    const el = document.createElement("div");
    el.className = "xp-float";
    el.textContent = text;
    parent.appendChild(el);
  }

  function restartAnimation(el, cls) {
    el.classList.remove("enter", cls);
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function confetti() {
    const colors = ["#E4572E", "#F6B519", "#22B573", "#3A86FF", "#FF6B9A", "#9B5DE5"];
    const wrap = document.createElement("div");
    wrap.className = "confetti";
    for (let i = 0; i < 90; i++) {
      const p = document.createElement("i");
      p.style.left = Math.random() * 100 + "vw";
      p.style.background = colors[i % colors.length];
      p.style.animationDelay = Math.random() * 0.6 + "s";
      p.style.animationDuration = 2 + Math.random() * 1.5 + "s";
      wrap.appendChild(p);
    }
    document.body.appendChild(wrap);
    setTimeout(() => wrap.remove(), 4500);
  }

  // ---------- Ansichten ----------
  function esc(str) {
    return String(str).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
  }

  function starsText(n, max) {
    return "★ " + n + " / " + max;
  }

  function soundButton() {
    return `<button class="icon-btn" data-action="toggle-sound" aria-label="Ton an/aus">${state.sound ? "🔊" : "🔇"}</button>`;
  }

  function sayButton(text) {
    return `<button class="say" data-action="say" data-text="${esc(text)}" aria-label="Vorlesen">🔊</button>`;
  }

  function playerCard() {
    const { level, into } = levelInfo(state.xp);
    const streak = currentStreak();
    return `
      <section class="player">
        <div class="player-top">
          <span class="lvl">Level ${level}</span>
          <span class="xp">${into} / ${XP_PER_LEVEL} XP</span>
        </div>
        <div class="bar"><span style="width:${(into / XP_PER_LEVEL) * 100}%"></span></div>
        <div class="chips">
          <span class="chip">🔥 ${streak} ${streak === 1 ? "Tag" : "Tage"}</span>
          <span class="chip">📚 ${learnedCount()} / ${VOCAB.length} Wörter</span>
          <span class="chip">⭐ ${totalVerbStars() + totalListenStars()} Sterne</span>
          <span class="chip">🏅 ${state.badges.length} / ${BADGES.length}</span>
        </div>
      </section>`;
  }

  function badgeTile(b) {
    const got = state.badges.includes(b.id);
    return `
      <div class="badge ${got ? "" : "locked"}">
        <div class="b-ico">${b.icon}</div>
        <div class="b-name">${esc(b.name)}</div>
        <div class="b-desc">${esc(b.desc)}</div>
      </div>`;
  }

  function homeView() {
    const active = MODULES.filter((m) => m.action);
    const upcoming = MODULES.filter((m) => !m.action);
    const moduleDesc = {
      vokabeln: `${learnedCount()} / ${VOCAB.length} Wörter gelernt`,
      verben: `${starsText(totalVerbStars(), TENSES.length * MAX_STARS_PER_TENSE)} · ${TENSES.length} Zeitformen`,
      hoeren: `${starsText(totalListenStars(), MAX_LISTEN_STARS)} · Wörter, Sätze, Zahlen`,
    };
    return `
      <header class="hero">
        <div class="logo">🌶️</div>
        <div>
          <h1>Poquito</h1>
          <p>¡Aprende español!</p>
        </div>
        <div class="spacer"></div>
        ${soundButton()}
      </header>

  function categoryTile(c) {
    const learned = catLearned(c);
    const total = c.words.length;
    const errors = c.words.filter((w) => state.wrongStack.includes(w.es)).length;
    let corner = "";
    if (learned === total) corner = `<span class="medal">🥇</span>`;
    else if (errors) corner = `<span class="pill err">${errors} ✗</span>`;
    return `
      <button class="tile" data-action="start" data-source="cat:${c.id}" style="--c:${c.color}">
        ${corner}
        <span class="ico">${c.icon}</span>
        <span class="name">${esc(c.name)}</span>
        <span class="desc">${learned} / ${total} gelernt</span>
        <span class="mini-bar"><span style="width:${(learned / total) * 100}%"></span></span>
      </button>`;
  }

  function conjTable(verbs, tense, marked) {
    const persons = personsFor(tense);
    const forms = verbs.map((v) => conj(v, tense));
    return `
      <div class="table-scroll">
        <table class="conj">
          <tr><th></th>${verbs.map((v) => `<th>${esc(v.inf)}</th>`).join("")}</tr>
          ${persons.map((p, i) => `
            <tr>
              <td class="pron">${esc(p)}</td>
              ${forms.map((f, j) => `<td>${marked ? markEnding(f[i], verbs[j], tense) : esc(f[i])}</td>`).join("")}
              ${verbs.length === 1 ? `<td>${sayButton(forms[0][i])}</td>` : ""}
            </tr>`).join("")}
        </table>
      </div>`;
  }

  function markEnding(form, v, tense) {
    if (form.includes(" ")) {
      const [aux, rest] = form.split(" ");
      return `<em>${esc(aux)}</em> ${esc(rest)}`;
    }
    const stem = tense === "futuro" || tense === "condicional" ? v.inf : v.inf.slice(0, -2);
    return form.startsWith(stem) ? esc(stem) + `<em>${esc(form.slice(stem.length))}</em>` : esc(form);
  }

    return `

  function drillAnswerArea() {
    const s = session;
    const t = s.task;
    if (s.level === 1) {
      const chars = t.picked.map((i) => t.letters[i]);
      const boxClass = t.result === "right" ? "correct" : t.result === "wrong" ? "wrong" : "";
      return `
        <div class="answer-box ${boxClass}">
          ${chars.length ? chars.map((ch) => (ch === " " ? `<span class="gap"></span>` : `<span>${esc(ch)}</span>`)).join("") : `<span class="placeholder">Tippe die Buchstaben unten</span>`}
        </div>
        ${t.result ? "" : `
          <div class="letters">
            ${t.letters.map((ch, i) => `
              <button class="letter ${ch === " " ? "space" : ""} ${t.picked.includes(i) ? "used" : ""}" data-action="pick" data-i="${i}">${ch === " " ? "␣" : esc(ch)}</button>`).join("")}
          </div>
          <div class="tools"><button class="btn light" data-action="unpick" ${t.picked.length ? "" : "disabled"}>⌫ Zurück</button></div>`}`;
    }
    if (s.level === 2) {
      return `
        <div class="options">
          ${t.options.map((o) => {
            let cls = "light";
            if (t.result && o === t.answer) cls = "is-right";
            else if (t.result && o === t.given) cls = "picked-wrong";
            return `<button class="btn ${cls}" data-action="option" data-value="${esc(o)}" ${t.result ? "disabled" : ""}>${esc(o)}</button>`;
          }).join("")}
        </div>`;
    }
    const inputClass = t.result === "right" ? "correct" : t.result === "wrong" ? "wrong" : "";
    return `
      <input class="type-input ${inputClass}" type="text" value="${esc(t.given)}" ${t.result ? "readonly" : ""}
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="${t.result ? "next" : "done"}" aria-label="Deine Antwort">
      ${t.result ? "" : `
        <div class="accents">${["á", "é", "í", "ó", "ú", "ñ", "ü"].map((a) => `<button class="accent" data-action="accent" data-char="${a}">${a}</button>`).join("")}</div>
        <button class="btn" data-action="check">Prüfen</button>`}`;
  }

      return `

  }

  function resultView() {
    const s = session;
    const titles = { 3: "¡Perfecto!", 2: "¡Muy bien!", 1: "¡Sigue así!" };
    const texts = {
      3: "Alles auf Anhieb gewusst!",
      2: "Stark gemacht – weiter so!",
      1: "Übung macht den Meister. Deine Fehler kommen bald wieder.",
    };
    const levelBefore = levelInfo(s.startXp).level;
    const levelNow = levelInfo(state.xp).level;
    let context = "";
    let canRepeat = true;
    let backAction = `data-action="open-vocab"`;
    if (s.kind === "verbs") {
      const group = VERB_GROUPS.find((g) => g.id === s.group);
      context = `<p>${esc(TENSE_BY_ID.get(s.tense).name)} · ${esc(group.name)} · Stufe ${s.level}</p>`;
      backAction = `data-action="open-tense" data-tense="${s.tense}"`;
    } else if (s.kind === "listen") {
      const src = LISTEN_SOURCES.find((x) => x.id === s.source);
      context = `<p>Hören · ${esc(src.name)} · ${esc(LISTEN_LEVELS[s.level - 1].name)}</p>`;
      backAction = `data-action="open-listen"`;
    } else {
      canRepeat = s.source.type !== "mistakes" || state.wrongStack.length > 0;
    }
    return `
      <div class="stage">
        <section class="result">
          <div class="stars">${[1, 2, 3].map((i) => `<span class="${i <= s.stars ? "on" : ""}">★</span>`).join("")}</div>
          <h2>${titles[s.stars]}</h2>
          <p>${texts[s.stars]}</p>
          ${context}
          <div class="summary">
            <div class="stat"><b>${s.firstRight}/${s.total}</b><span>auf Anhieb</span></div>
            <div class="stat"><b>+${s.xp}</b><span>XP</span></div>
            <div class="stat"><b>${s.bestCombo}</b><span>beste Serie</span></div>
          </div>
          ${levelNow > levelBefore ? `<div class="levelup">🎊 Level ${levelNow} erreicht!</div>` : ""}
          ${s.newBadges.length ? `
            <div class="new-badges">
              <h3>Neues Abzeichen!</h3>
              <div class="badges">${s.newBadges.map(badgeTile).join("")}</div>
            </div>` : ""}
        </section>
        <div class="btn-stack">
          ${canRepeat ? `<button class="btn" data-action="again">Nächste Runde</button>` : ""}
          <button class="btn light" ${backAction}>Zur Übersicht</button>
        </div>
      </div>`;
  }

  const VIEWS = {
    home: homeView,
    vocab: vocabView,
    session: sessionView,
    verbs: verbsView,
    tense: tenseView,
    rules: rulesView,
    listen: listenView,
    drill: drillView,
    result: resultView,
  };

  function render() {
    app.innerHTML = VIEWS[view]();
    if (view !== lastView) {
      window.scrollTo(0, 0);
      lastView = view;
    }
  }

  function go(next) {
    if (synth) synth.cancel();
    session = next === "session" || next === "drill" || next === "result" ? session : null;
    busy = false;
    view = next;
    render();
  }

  // ---------- Bedienung ----------
  const BACK_ACTIONS = new Set(["home", "exit"]);
  const OWN_SOUND = new Set(["answer", "flip", "pick", "unpick", "option", "check", "speak", "say", "locked", "toggle-sound", "accent", "replay", "replay-slow"]);

  app.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".accent")) e.preventDefault();
  });

  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    unlockAudio();
    const action = el.dataset.action;
    const goingBack = BACK_ACTIONS.has(action) || el.getAttribute("aria-label") === "Zurück";
    if (goingBack) sfx.back();
    else if (!OWN_SOUND.has(action)) sfx.tap();

    switch (action) {
      case "home":
        go("home");
        break;
      case "open-vocab":
        go("vocab");
        break;
      case "open-verbs":
        go("verbs");
        break;
      case "open-tense":
        currentTense = el.dataset.tense;
        go("tense");
        break;
      case "open-rules":
        go("rules");
        break;
      case "locked":
        sfx.locked();
        restartAnimation(el, "wiggle");
        break;
      case "start":
        startVocab(parseSource(el.dataset.source));
        break;
      case "start-drill":
        startDrill(currentTense, el.dataset.group);
        break;
      case "open-listen":
        go("listen");
        break;
      case "start-listen":
        startListen(el.dataset.source);
        break;
      case "again":
        if (session.kind === "verbs") startDrill(session.tense, session.group);
        else if (session.kind === "listen") startListen(session.source);
        else startVocab(session.source);
        break;
      case "set-level":
        state.verbLevel = Number(el.dataset.level);
        saveState();
        render();
        break;
      case "set-listen-level":
        state.listenLevel = Number(el.dataset.level);
        saveState();
        render();
        break;
      case "replay":
      case "replay-slow":
        if (!state.sound) {
          state.sound = true;
          saveState();
        }
        speak(session.task.audio, action === "replay-slow" ? 0.55 : 0.9);
        break;
      case "flip":
        if (busy) return;
        sfx.flip();
        el.classList.toggle("flipped");
        app.querySelector(".actions").classList.remove("hidden");
        break;
      case "speak":
        speak(session.current);
        break;
      case "say":
        speak(el.dataset.text);
        break;
      case "answer":
        answerCard(el.dataset.knew === "1");
        break;
      case "pick": {
        const t = session.task;
        const i = Number(el.dataset.i);
        if (t.result || t.picked.includes(i)) return;
        t.picked.push(i);
        sfx.select(t.picked.length);
        if (t.picked.length === t.letters.length) submitDrill(t.picked.map((n) => t.letters[n]).join(""));
        else render();
        break;
      }
      case "unpick":
        session.task.picked.pop();
        sfx.remove();
        render();
        break;
      case "option":
        submitDrill(el.dataset.value);
        break;
      case "accent": {
        const input = app.querySelector(".type-input");
        const start = input.selectionStart == null ? input.value.length : input.selectionStart;
        const end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
        input.setRangeText(el.dataset.char, start, end, "end");
        input.focus();
        sfx.select(1);
        break;
      }
      case "check":
        submitDrill(app.querySelector(".type-input").value);
        break;
      case "next-task":
        nextTask();
        break;
      case "exit":
        go({ verbs: "tense", listen: "listen", vocab: "vocab" }[session.kind]);
        break;
      case "toggle-sound":
        state.sound = !state.sound;
        if (!state.sound && synth) synth.cancel();
        saveState();
        el.textContent = state.sound ? "🔊" : "🔇";
        sfx.tap();
        break;
      case "reset":
        if (confirm("Wirklich den gesamten Fortschritt (Wörter, Verben, Hören, XP, Abzeichen) löschen?")) {
          state = Object.assign(defaultState(), { sound: state.sound });
          saveState();
          render();
        }
        break;
    }
  });

  app.addEventListener("keydown", (e) => {
    if (e.key !== "Enter" || !e.target.classList.contains("type-input") || !session || !session.task) return;
    e.preventDefault();
    unlockAudio();
    if (session.task.result) nextTask();
    else submitDrill(e.target.value);
  });

  app.addEventListener("change", (e) => {
    if (!e.target.classList.contains("verb-select")) return;
    unlockAudio();
    sfx.tap();
    lookupVerb = e.target.value;
    render();
  });

  render();
})();
</script>

</body>
</html>
