              <div class="ex-es">${snd.words.map((w) => esc(w.es)).join(" · ")}</div>
            </div>
            ${sayButton(snd.words.map((w) => w.es).join(", "))}
          </div>`).join("")}
      </section>`;
  }

  function speakDrillView() {
    const s = session;
    const t = s.task;
    const src = SPEAK_SOURCES.find((x) => x.id === s.source);
    const level = SPEAK_LEVELS[s.level - 1];
    const snd = t.sound ? SOUND_BY_ID.get(t.sound) : null;
    const mode = speakMode();
    const attempted = t.result || t.recordingUrl;
    const fresh = s.fresh;
    s.fresh = false;

    let main;
    if (s.level === 1) main = `<div class="word">${esc(t.es)}</div><div class="sub">${esc(t.de)}</div>`;
    else if (s.level === 2) main = attempted ? `<div class="word">${esc(t.es)}</div><div class="sub">${esc(t.de)}</div>` : `<button class="play-btn" data-action="speak" aria-label="Anhören">🔊</button>`;
    else main = `<div class="word">${esc(t.de)}</div>${attempted ? `<div class="sub">${esc(t.es)}</div>` : ""}`;
    const listenBtns = s.level < 3 || attempted
      ? `<div class="listen-row">
          ${s.level === 2 && !attempted ? "" : `<button class="slow-btn" data-action="speak">🔊 Anhören</button>`}
          <button class="slow-btn" data-action="speak-slow">🐢 Langsam</button>
        </div>`
      : "";

    let answer = "";
    if (t.result && t.marks) {
      answer = `
        <div class="feedback ${t.result === "right" ? "good" : "bad"}">
          ${t.result === "right" ? "✓ ¡Muy bien!" : "Fast! Die roten Wörter habe ich nicht erkannt."}
          <div class="said">${t.es.split(/\s+/).map((tok, i) => `<span class="${t.marks[i] ? "ok" : "miss"}">${esc(tok)}</span>`).join(" ")}</div>
          <div class="heard">Verstanden: „${esc(t.heard)}“</div>
          ${t.result === "wrong" ? `
            <div class="row-btns">
              <button class="btn" data-action="mic">🎤 Nochmal</button>
              <button class="btn light" data-action="speak-next">Weiter</button>
            </div>` : ""}
        </div>`;
    } else if (mode === "record" && t.recordingUrl && !t.result) {
      answer = `
        <div class="feedback neutral">
          Vergleiche deine Aufnahme mit dem Original:
          <div class="row-btns">
            <button class="btn light" data-action="play-mine">▶ Meine Aufnahme</button>
            <button class="btn light" data-action="speak">🔊 Original</button>
          </div>
          <div class="row-btns">
            <button class="btn good" data-action="speak-self" data-ok="1">✓ Klang gut</button>
            <button class="btn bad" data-action="speak-self" data-ok="0">✗ Noch nicht</button>
          </div>
        </div>`;
    } else if (mode === "self" && !t.result) {
      answer = `
        <div class="row-btns">
          <button class="btn good" data-action="speak-self" data-ok="1">✓ Konnte ich</button>
          <button class="btn bad" data-action="speak-self" data-ok="0">✗ Noch nicht</button>
        </div>`;
    } else if (t.result === "right") {
      answer = `<div class="feedback good">✓ ¡Muy bien!</div>`;
    }

    const showMic = mode !== "self" && t.result !== "right" && !(t.result === "wrong" && t.marks);
    const micLabel = s.listening
      ? (mode === "auto" ? "Ich höre zu … sprich jetzt" : "Aufnahme läuft … tippen zum Stoppen")
      : (t.recordingUrl ? "Nochmal aufnehmen" : "Tippen und sprechen");

    return `
      ${sessionTopbar()}
      <div class="stage">
        <div class="prompt ${fresh ? "enter" : ""}">
          <span class="cat-chip" style="--c:${src.color}">${snd ? "👅 " + esc(snd.title) : src.icon + " " + esc(src.name)}</span>
          <span class="lang">Stufe ${s.level}</span>
          ${main}
          ${listenBtns}
          ${snd && s.level < 3 ? `<div class="tip">💡 ${esc(snd.tip)}</div>` : ""}
          <div class="task">${esc(level.hint)}</div>
        </div>
        ${showMic ? `
          <div class="speak-area">
            <button class="mic-btn ${s.listening ? "on" : ""}" data-action="mic" aria-label="${esc(micLabel)}">${s.listening ? "■" : "🎤"}</button>
            <div class="mic-label">${esc(micLabel)}</div>
            ${mode === "auto" ? `<div class="interim">${esc(s.interim)}</div>` : ""}
          </div>` : ""}
        ${s.notice ? `<div class="notice">${esc(s.notice)}</div>` : ""}
        ${answer}
        ${t.result ? "" : `<button class="link-btn" data-action="speak-skip">Überspringen</button>`}
      </div>`;
  }

      <div class="topbar">

  function episodeView() {
    const p = player;
    const ep = PODCAST_BY_ID.get(p.id);
    const total = episodeSeconds(ep, ep.lines.length);
    const now = p.finished ? total : episodeSeconds(ep, p.index);
    return `
      <div class="topbar">
        <button class="icon-btn" data-action="open-podcasts" aria-label="Zurück">←</button>
        <h2>${ep.icon} ${esc(ep.title)}<small>${esc(ep.de)} · ${ep.type === "story" ? "Geschichte" : "Gespräch"} · ${ep.level}</small></h2>
      </div>
      ${synth ? "" : `<div class="notice">Dein Browser kann leider nichts vorlesen. Bitte öffne Poquito in Safari.</div>`}
      <section class="pc-player">
        <div class="pc-controls">
          <button class="pc-btn" data-action="pc-prev" aria-label="Satz zurück">⏮</button>
          <button class="pc-btn pc-main" data-action="pc-play" aria-label="${p.playing ? "Pause" : "Abspielen"}">${p.playing ? "⏸" : "▶"}</button>
          <button class="pc-btn" data-action="pc-next" aria-label="Satz vor">⏭</button>

        <div class="progress pc-progress"><span style="width:${(now / total) * 100}%"></span></div>
        <div class="pc-time"><span class="pc-now">${formatTime(now)}</span><span class="pc-total">${formatTime(total)}</span></div>
        ${p.index > 0 && !p.playing && !p.finished ? `
          <div class="pc-resume">▶ Weiter ab Satz ${p.index + 1} von ${ep.lines.length} · <button class="link-btn inline" data-action="pc-restart">Von vorn</button></div>` : ""}
        <div class="pc-options">
          <div class="speeds">
            ${PODCAST_SPEEDS.map((x) => `<button class="speed ${x === state.podcastSpeed ? "on" : ""}" data-action="set-speed" data-speed="${x}">${String(x).replace(".", ",")}×</button>`).join("")}
          </div>
          <button class="toggle ${state.podcastShowDe ? "on" : ""}" data-action="toggle-de">🇩🇪 Übersetzung ${state.podcastShowDe ? "an" : "aus"}</button>
        </div>
        ${p.finished ? `
          <div class="pc-done">

            ${p.newBadges.length ? `<div class="badges">${p.newBadges.map(badgeTile).join("")}</div>` : ""}
            <div class="btn-stack pair">

              <button class="btn light" data-action="pc-play">↺ Nochmal hören</button>

      </section>
      <section class="panel transcript">

          const sp = ep.speakers ? ep.speakers[line.s] : null;
          return `
            <button class="line ${p.started && i === p.index ? "active" : ""}" data-action="jump" data-i="${i}" ${sp ? `style="--c:${sp.color}"` : ""}>
              ${sp ? `<span class="who">${esc(sp.name)}</span>` : ""}
              <span class="es">${esc(line.es)}</span>
              ${state.podcastShowDe ? `<span class="de">${esc(line.de)}</span>` : ""}
            </button>`;
        }).join("")}

  function quizView() {

    const ep = PODCAST_BY_ID.get(s.episode);
    const fresh = s.fresh;
    s.fresh = false;
    return `
      ${sessionTopbar()}
      <div class="stage">
        <div class="prompt ${fresh ? "enter" : ""}">
          <span class="cat-chip" style="--c:${ep.color}">${ep.icon} ${esc(ep.title)}</span>
          <span class="lang">Verständnis</span>

        </div>

        ${drillFeedback()}
      </div>`;
  }

  function drillView() {
    if (session.kind === "listen") return listenDrillView();
    if (session.kind === "quiz") return quizView();
    if (session.kind === "speak") return speakDrillView();
    const s = session;
    const t = s.task;
    const tense = TENSE_BY_ID.get(s.tense);
    const level = LEVELS[s.level - 1];
    const fresh = s.fresh;
    s.fresh = false;
    return `
      ${sessionTopbar()}
      <div class="stage">
        <div class="prompt ${fresh ? "enter" : ""}">
          <span class="cat-chip" style="--c:${tense.color}">${tense.icon} ${esc(tense.name)}</span>
          <span class="lang">Stufe ${s.level}</span>
          <div class="pron">${esc(personsFor(s.tense)[t.person])}</div>
          <div class="inf">${esc(t.verb.inf)} <small>· ${esc(t.verb.de)}</small> ${sayButton(t.verb.inf)}</div>
          <div class="task">${esc(level.hint)}</div>
        </div>
        ${drillAnswerArea()}
        ${drillFeedback()}
      </div>`;
  }

  // Nach einer Vokabel-Runde: wo jedes Wort jetzt steht (Punkte = Runden auf Anhieb gewusst).
  function wordResults(s) {
    if (s.kind !== "vocab") return "";
    const rows = [...s.firstTry].map(([id, ok]) => {
      const w = WORDS.get(id);
      const p = state.progress[id];
      const lvl = p ? Math.min(p.level, LEARNED_LEVEL) : 0;
      const dots = Array.from({ length: LEARNED_LEVEL }, (_, i) => `<i class="${i < lvl ? "on" : ""}"></i>`).join("");
      const label = lvl >= LEARNED_LEVEL ? "gelernt ✓" : ok ? `noch ${LEARNED_LEVEL - lvl}× bis gelernt` : "kommt wieder";
      return `
        <li class="${ok ? "ok" : "miss"}">
          <span class="wr-word"><b>${ok ? "✓" : "✗"} ${esc(w.es)}</b> <span>${esc(w.de)}</span></span>
          <span class="wr-level"><span class="dots">${dots}</span>${label}</span>
        </li>`;
    });
    return `
      <section class="word-results">
        <h3>So stehen deine Wörter</h3>
        <ul>${rows.join("")}</ul>
      </section>`;
  }

  function resultView() {
    const s = session;
    const titles = { 3: "¡Perfecto!", 2: "¡Muy bien!", 1: "¡Sigue así!" };
    const texts = {
      3: "Alles auf Anhieb gewusst!",
      2: "Stark gemacht – weiter so!",
      1: "Übung macht den Meister. Deine Fehler kommen bald wieder.",
    };
    const levelBefore = levelInfo(s.startXp).level;
    const levelNow = levelInfo(state.xp).level;
    let context = "";
    let canRepeat = true;
    let backAction = `data-action="open-vocab"`;
    if (s.kind === "verbs") {
      const group = VERB_GROUPS.find((g) => g.id === s.group);
      context = `<p>${esc(TENSE_BY_ID.get(s.tense).name)} · ${esc(group.name)} · Stufe ${s.level}</p>`;
      backAction = `data-action="open-tense" data-tense="${s.tense}"`;
    } else if (s.kind === "listen") {
      const src = LISTEN_SOURCES.find((x) => x.id === s.source);
      context = `<p>Hören · ${esc(src.name)} · ${esc(LISTEN_LEVELS[s.level - 1].name)}</p>`;
      backAction = `data-action="open-listen"`;
    } else if (s.kind === "quiz") {
      context = `<p>Podcast · ${esc(PODCAST_BY_ID.get(s.episode).title)}</p>`;
      backAction = `data-action="open-podcasts"`;
    } else if (s.kind === "speak") {
      const src = SPEAK_SOURCES.find((x) => x.id === s.source);
      context = `<p>Sprechen · ${esc(src.name)} · ${esc(SPEAK_LEVELS[s.level - 1].name)}</p>`;
      backAction = `data-action="open-speak"`;
    } else {
      canRepeat = s.source.type !== "mistakes" || state.wrongStack.length > 0;
    }
    return `
      <div class="stage">
        <section class="result">
          <div class="stars">${[1, 2, 3].map((i) => `<span class="${i <= s.stars ? "on" : ""}">★</span>`).join("")}</div>
          <h2>${titles[s.stars]}</h2>
          <p>${texts[s.stars]}</p>
          ${context}
          <div class="summary">
            <div class="stat"><b>${s.firstRight}/${s.total}</b><span>auf Anhieb</span></div>
            <div class="stat"><b>+${s.xp}</b><span>XP</span></div>
            <div class="stat"><b>${s.bestCombo}</b><span>beste Serie</span></div>
          </div>
          ${s.goalReached ? `<div class="levelup goal-banner">🎯 Tagesziel erreicht! ${todayXp()} XP heute – ¡Muy bien!</div>` : ""}
          ${levelNow > levelBefore ? `<div class="levelup">🎊 Level ${levelNow} erreicht!</div>` : ""}
          ${s.newBadges.length ? `
            <div class="new-badges">
              <h3>Neues Abzeichen!</h3>
              <div class="badges">${s.newBadges.map(badgeTile).join("")}</div>
            </div>` : ""}
        </section>
        ${wordResults(s)}
        <div class="btn-stack">
          ${canRepeat ? `<button class="btn" data-action="again">Nächste Runde</button>` : ""}
          <button class="btn light" ${backAction}>Zur Übersicht</button>
        </div>
      </div>`;
  }

  const VIEWS = {
    home: homeView,
    vocab: vocabView,
    session: sessionView,
    verbs: verbsView,
    tense: tenseView,
    rules: rulesView,
    listen: listenView,
    podcasts: podcastsView,
    episode: episodeView,
    speak: speakView,
    drill: drillView,
    result: resultView,
    translate: translateView,
    settings: settingsView,
    write: writeView,
    compose: composeView,
    writeResult: writeResultView,
  };

  // Die drei Hauptbereiche bekommen unten eine Tab-Leiste.
  const TAB_VIEWS = new Set(["home", "translate", "settings"]);
  const tabbar = document.getElementById("tabbar");

  function render() {
    app.innerHTML = VIEWS[view]();
    const tabs = TAB_VIEWS.has(view);
    tabbar.hidden = !tabs;
    document.body.classList.toggle("has-tabs", tabs);
    tabbar.querySelectorAll("[data-tab]").forEach((b) => b.classList.toggle("on", b.dataset.tab === view));
    if (view !== lastView) {
      window.scrollTo(0, 0);
      lastView = view;
      restartAnimation(app, "view-enter");
      clearTimeout(viewEnterTimer);
      viewEnterTimer = setTimeout(() => app.classList.remove("view-enter"), 320);
    }
  }

  function go(next) {
    if (synth) synth.cancel();
    document.body.classList.remove("speaking");
    abortListening();
    stopPlayer();
    player = null;
    const staying = next === "session" || next === "drill" || next === "result";
    view = next;
    if (session && !staying) saveRound(); // offene Runde bleibt zum Fortsetzen
    session = staying ? session : null;
    busy = false;
    render();
  }

  // ---------- Bedienung ----------
  const BACK_ACTIONS = new Set(["home", "exit"]);
  // Keine Klick-Töne, wo gleich eigene Töne, Sprache oder das Mikrofon starten.
  const OWN_SOUND = new Set(["answer", "flip", "pick", "unpick", "option", "check", "speak", "speak-slow", "say", "locked", "toggle-sound", "accent", "replay", "replay-slow", "mic", "play-mine", "speak-self", "voice-test", "tr-speak", "tr-save", "w-insert", "w-speak", "w-check"]);

  app.addEventListener("pointerdown", (e) => {
    if (e.target.closest(".accent")) e.preventDefault();
  });

  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-action]");
    if (!el || el.disabled) return;
    unlockAudio();
    const action = el.dataset.action;
    const goingBack = BACK_ACTIONS.has(action) || el.getAttribute("aria-label") === "Zurück";
    if (goingBack) sfx.back();
    else if (!OWN_SOUND.has(action)) sfx.tap();

    switch (action) {
      case "home":
        go("home");
        break;
      case "open-vocab":
        go("vocab");
        break;
      case "open-verbs":
        go("verbs");
        break;
      case "open-tense":
        currentTense = el.dataset.tense;
        go("tense");
        break;
      case "open-rules":
        go("rules");
        break;
      case "locked":
        sfx.locked();
        restartAnimation(el, "wiggle");
        break;
      case "start":
        startVocab(parseSource(el.dataset.source));
        break;
      case "start-drill":
        startDrill(currentTense, el.dataset.group);
        break;
      case "open-listen":
        go("listen");
        break;
      case "open-podcasts":
        go("podcasts");
        break;
      case "open-episode":
        openEpisode(el.dataset.id);
        break;
      case "pc-play":
        togglePlay();
        break;
      case "pc-prev":
        step(-1);
        break;
      case "pc-next":
        step(1);
        break;
      case "jump":
        jumpTo(Number(el.dataset.i));
        break;
      case "set-speed":
        setSpeed(Number(el.dataset.speed));
        break;
      case "toggle-de":
        state.podcastShowDe = !state.podcastShowDe;
        saveState();
        render();
        updatePlayer(player.started);
        break;
      case "start-quiz":
        startQuiz(el.dataset.id);
        break;
      case "start-listen":
        startListen(el.dataset.source);
        break;
      case "again":
        if (session.kind === "verbs") startDrill(session.tense, session.group);
        else if (session.kind === "listen") startListen(session.source);
        else if (session.kind === "quiz") startQuiz(session.episode);
        else if (session.kind === "speak") startSpeak(session.source);
        else startVocab(session.source);
        break;
      case "set-level":
        state.verbLevel = Number(el.dataset.level);
        saveState();
        render();
        break;
      case "set-listen-level":
        state.listenLevel = Number(el.dataset.level);
        saveState();
        render();
        break;
      case "replay":
      case "replay-slow":
        if (!state.sound) {
          state.sound = true;
          saveState();
        }
        speak(session.task.audio, action === "replay-slow" ? 0.55 : 0.9);
        break;
      case "flip":
        if (busy) return;
        sfx.flip();
        el.classList.toggle("flipped");
        app.querySelector(".actions").classList.remove("hidden");
        break;
      case "speak":
        speak(session.kind === "speak" ? session.task.es : session.current);
        break;
      case "speak-slow":
        speak(session.task.es, 0.55);
        break;
      case "open-speak":
        go("speak");
        break;
      case "set-speak-level":
        state.speakLevel = Number(el.dataset.level);
        saveState();
        render();
        break;
      case "set-speak-mode":
        state.speakMode = el.dataset.mode;
        saveState();
        render();
        break;
      case "start-speak":
        startSpeak(el.dataset.source);
        break;
      case "mic":
        micPressed();
        break;
      case "play-mine":
        playRecording();
        break;
      case "speak-self":
        if (el.dataset.ok === "1") submitSpeak(true, "", null);
        else {
          playWrong();
          speakGiveUp();
        }
        break;
      case "speak-next":
      case "speak-skip":
        speakGiveUp();
        break;
      case "say":
        speak(el.dataset.text);
        break;
      case "set-goal":
        state.dailyGoal = Number(el.dataset.goal);
        saveState();
        render();
        break;
      case "export":
        exportProgress();
        break;
      case "import":
        app.querySelector(".import-file").click();
        break;
      case "pc-restart":
        jumpTo(0);
        break;
      case "resume":
        resumeRound();
        break;
      case "open-settings":
        go("settings");
        break;
      case "open-write":
        go("write");
        break;
      case "w-start":
        startWriting(el.dataset.focus);
        break;
      case "w-shuffle":
        startWriting(writing.focus);
        break;
      case "w-continue":
      case "w-revise":
        go("compose");
        break;
      case "w-check":
        checkWriting();
        break;
      case "w-history":
        openWriteHistory(Number(el.dataset.i));
        break;
      case "w-rules":
        currentTense = el.dataset.tense;
        go("rules");
        break;
      case "w-speak":
        if (!state.sound) {
          state.sound = true;
          saveState();
        }
        speak(writing.result.corrected);
        break;
      case "w-insert": {
        const input = app.querySelector(".write-input");
        const start = input.selectionStart == null ? input.value.length : input.selectionStart;
        const end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
        const before = input.value.slice(0, start);
        const piece = (before && !/\s$/.test(before) ? " " : "") + el.dataset.text + " ";
        input.setRangeText(piece, start, end, "end");
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.focus();
        sfx.select(1);
        break;
      }
      case "toggle-backup":
        backupOpen = !el.closest("details").open;
        break;
      case "toggle-sound-setting":
        state.sound = !state.sound;
        if (!state.sound && synth) synth.cancel();
        saveState();
        render();
        break;
      case "open-conj":
        currentTense = el.dataset.tense;
        lookupVerb = el.dataset.verb;
        go("rules");
        {
          const lookup = app.querySelector(".verb-select");
          if (lookup) lookup.closest(".panel").scrollIntoView({ block: "start" });
        }
        break;
      case "tr-go":
        translate();
        break;
      case "tr-swap":
        state.translateDir = state.translateDir === "de-es" ? "es-de" : "de-es";
        if (translator.result) translator.text = translator.result.main;
        translator.result = null;
        translator.note = "";
        translator.error = "";
        saveState();
        render();
        break;
      case "tr-clear":
        translator.text = "";
        translator.result = null;
        translator.note = "";
        translator.error = "";
        translator.token++;
        translator.loading = false;
        render();
        app.querySelector(".tr-input").focus();
        break;
      case "tr-speak": {
        const r = translator.result;
        if (!state.sound) {
          state.sound = true;
          saveState();
        }
        speak(r.to === "es" ? r.main : r.source);
        break;
      }
      case "tr-copy":
        copyText(translator.result.main, el);
        break;
      case "tr-save":
        saveMyWord();
        break;
      case "tr-alt": {
        const r = translator.result;
        const i = Number(el.dataset.i);
        [r.main, r.alts[i]] = [r.alts[i], r.main];
        r.hints = grammarHints(r.from === "es" ? r.source : r.main);
        render();
        break;
      }
      case "tr-history":
        showHistory(Number(el.dataset.i));
        break;
      case "tr-history-clear":
        try {
          localStorage.removeItem(HISTORY_KEY);
        } catch (err) {
          // nichts zu tun
        }
        render();
        break;
      case "mw-del":
        removeMyWord(el.dataset.es);
        break;
      case "discard-round":
        clearRound();
        render();
        break;
      case "voice-test":
        if (!state.sound) {
          state.sound = true;
          saveState();
        }
        speak(VOICE_SAMPLE);
        break;
      case "answer":
        answerCard(el.dataset.knew === "1");
        break;
      case "pick": {
        const t = session.task;
        const i = Number(el.dataset.i);
        if (t.result || t.picked.includes(i)) return;
        t.picked.push(i);
        sfx.select(t.picked.length);
        if (t.picked.length === t.letters.length) submitDrill(t.picked.map((n) => t.letters[n]).join(""));
        else render();
        break;
      }
      case "unpick":
        session.task.picked.pop();
        sfx.remove();
        render();
        break;
      case "option":
        submitDrill(el.dataset.value);
        break;
      case "accent": {
        const input = app.querySelector(".type-input, .tr-input, .write-input");
        const start = input.selectionStart == null ? input.value.length : input.selectionStart;
        const end = input.selectionEnd == null ? input.value.length : input.selectionEnd;
        input.setRangeText(el.dataset.char, start, end, "end");
        input.dispatchEvent(new Event("input", { bubbles: true }));
        input.focus();
        sfx.select(1);
        break;
      }
      case "check":
        submitDrill(app.querySelector(".type-input").value);
        break;
      case "next-task":
        nextTask();
        break;
      case "exit":
        go({ verbs: "tense", listen: "listen", quiz: "podcasts", speak: "speak", vocab: "vocab" }[session.kind]);
        break;
      case "toggle-sound":
        state.sound = !state.sound;
        if (!state.sound && synth) synth.cancel();
        saveState();
        el.textContent = state.sound ? "🔊" : "🔇";
        sfx.tap();
        break;
      case "reset":
        if (confirm("Wirklich den gesamten Lernfortschritt (Wörter, Verben, Hören, Podcast, Sprechen, XP, Abzeichen) löschen? Deine Einstellungen und „Meine Wörter“ bleiben erhalten.")) {
          const keep = ["sound", "voiceURI", "dailyGoal", "translateDir", "myWords"];
          state = Object.assign(defaultState(), Object.fromEntries(keep.map((k) => [k, state[k]])));
          registerMyWords(state.myWords);
          clearRound();
          saveState(true);
          render();
        }
        break;
    }
  });

  app.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey && e.target.classList.contains("tr-input")) {
      e.preventDefault();
      e.target.blur();
      translate();
      return;
    }
    if (e.key !== "Enter" || !e.target.classList.contains("type-input") || !session || !session.task) return;
    e.preventDefault();
    unlockAudio();
    if (session.task.result) nextTask();
    else submitDrill(e.target.value);
  });

  app.addEventListener("input", (e) => {
    if (e.target.classList.contains("tr-input")) translator.text = e.target.value;
    if (e.target.classList.contains("write-input")) {
      writing.text = e.target.value;
      saveWriting();
      const counter = app.querySelector(".w-count");
      if (counter) counter.textContent = writeCountText(writing.text);
    }
  });

  tabbar.addEventListener("click", (e) => {
    const b = e.target.closest("[data-tab]");
    if (!b || b.dataset.tab === view) return;
    unlockAudio();
    sfx.tap();
    go(b.dataset.tab);
  });

  app.addEventListener("change", (e) => {
    if (e.target.classList.contains("import-file")) {
      if (e.target.files[0]) importProgress(e.target.files[0]);
      e.target.value = "";
      return;
    }
    if (e.target.classList.contains("voice-select")) {
      state.voiceURI = e.target.value || null;
      saveState();
      pickVoice();
      speak(VOICE_SAMPLE);
      return;
    }
    if (!e.target.classList.contains("verb-select")) return;
    unlockAudio();
    sfx.tap();
    lookupVerb = e.target.value;
    render();
  });

  // Andere Tabs/Fenster derselben Seite: deren Stand übernehmen, statt ihn später zu überschreiben.
  window.addEventListener("storage", (e) => {
    if (e.key === STORAGE_KEY || e.key === null) syncFromStorage();
  });
  window.addEventListener("pageshow", () => syncFromStorage());
  window.addEventListener("focus", () => syncFromStorage());
  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) syncFromStorage();
  });

  saveState();
  requestPersistence();
  const pending = loadRound();
  if (pending && pending.active && Date.now() - pending.savedAt < AUTO_RESUME_MS) resumeRound();
  else render();
})();
</script>

</body>
</html>
